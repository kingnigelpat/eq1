<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Up - EQ</title>
    <link rel="icon" href="/static/Rae-logo.png" type="image/png">
    <link rel="stylesheet" href="/static/eq_style.css">
    <link rel="manifest" href="/static/manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js');
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: url('/static/ethereal_aurora_bg.png') no-repeat center center;
            background-size: cover;
            filter: brightness(0.6) saturate(1.2);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, transparent, #020617);
        }

        .signup-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo-image {
            width: 110px;
            height: auto;
            margin: 0 auto 1.5rem;
            filter: drop-shadow(0 0 15px var(--primary-glow));
        }

        h2 {
            color: #fff;
            margin-bottom: 0.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 2rem 1.5rem;
                border-radius: 16px;
                max-width: 90%;
            }

            .avatar {
                width: 60px;
                height: 60px;
                font-size: 1rem;
            }

            h2 {
                font-size: 1.5rem;
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #FFD700;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px -5px var(--primary-glow);
        }

        button:active {
            transform: scale(0.98);
        }

        .footer-links {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .footer-links a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .disclaimer {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 1.5rem;
            line-height: 1.4;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="bg-animation"></div>
    <div class="bg-overlay"></div>

    <div class="signup-container">
        <img src="/static/Rae-logo.png" class="logo-image" alt="EQ Logo">
        <h2>Create Account</h2>
        <p class="subtitle">Join EQ and start your journey.</p>

        <form id="signupForm">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder="Email Address" required autocomplete="email">
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required autocomplete="new-password">
            </div>
            <button type="submit" id="submitBtn">Create Account</button>
        </form>

        <div class="footer-links">
            <p>Already have an account? <a href="/login">Sign In</a></p>
        </div>

        <p class="disclaimer">
            <strong>Privacy Notice:</strong> Conversations are temporary and not permanently stored.
        </p>
    </div>

    <script type="module">
        import { auth, createUserWithEmailAndPassword, onAuthStateChanged } from "/static/firebase_init.js";

        // Auto-login if Firebase session exists
        let autoLoginAttempted = false;
        onAuthStateChanged(auth, async (user) => {
            if (user && !autoLoginAttempted) {
                autoLoginAttempted = true;
                try {
                    const idToken = await user.getIdToken();
                    const response = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ idToken: idToken })
                    });
                    const result = await response.json();
                    if (response.ok && result.success) {
                        window.location.href = result.redirect;
                    }
                } catch (error) {
                    console.error("Auto-login failed:", error);
                }
            }
        });

        const signupForm = document.getElementById('signupForm');
        const submitBtn = document.getElementById('submitBtn');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.textContent = "Creating Account...";
            submitBtn.disabled = true;

            const formData = new FormData(signupForm);
            const username = formData.get('username');
            const email = formData.get('email');
            const password = formData.get('password');

            try {
                // 1. Create User in Firebase Client
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const idToken = await userCredential.user.getIdToken();

                // 2. Send Token and Username to Backend for Firestore Record & Session
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        idToken: idToken,
                        username: username
                    })
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Journey Started',
                        text: 'Welcome to EQ!',
                        timer: 1500,
                        showConfirmButton: false,
                        background: '#111', color: '#fff'
                    }).then(() => {
                        window.location.href = result.redirect || '/app';
                    });
                } else {
                    throw new Error(result.message || 'Registration failed');
                }
            } catch (error) {
                console.error('Error:', error);
                let msg = error.message;
                if (error.code === 'auth/email-already-in-use') msg = "That email is already registered.";
                if (error.code === 'auth/weak-password') msg = "Password is too weak.";

                Swal.fire({
                    icon: 'error',
                    title: 'Signup Error',
                    text: msg,
                    background: '#111', color: '#fff'
                });
                submitBtn.textContent = "Create Account";
                submitBtn.disabled = false;
            }
        });
    </script>
</body>

</html>
