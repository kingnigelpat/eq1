<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EQ - Your Emotional Companion</title>
    <link rel="icon" href="/static/Rae-logo.png" type="image/png">
    <link rel="stylesheet" href="/static/eq_style.css">
    <link rel="manifest" href="/static/manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        // Check if running as a standalone app
        window.isAppInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.log('SW Error', err));
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Splash / Loader */
        .eq-loader {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 9999;
            background: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }
        .eq-loader.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .eq-loader img {
            width: 120px;
            height: auto;
            animation: loaderPulse 1.8s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(212, 175, 55, 0.4));
        }
        .eq-loader .loader-bar {
            width: 120px;
            height: 3px;
            background: rgba(255,255,255,0.1);
            border-radius: 3px;
            margin-top: 24px;
            overflow: hidden;
        }
        .eq-loader .loader-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #D4AF37, #E6BE8A);
            border-radius: 3px;
            animation: loaderFill 1.8s ease-in-out forwards;
        }
        @keyframes loaderPulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.08); opacity: 1; }
        }
        @keyframes loaderFill {
            0% { width: 0%; }
            60% { width: 70%; }
            100% { width: 100%; }
        }

        @keyframes pulse-gold {
            0% {
                transform: scale(1);
                text-shadow: 0 0 5px var(--primary);
            }

            50% {
                transform: scale(1.15);
                text-shadow: 0 0 25px var(--primary);
            }

            100% {
                transform: scale(1);
                text-shadow: 0 0 5px var(--primary);
            }
        }

        .install-ready {
            animation: pulse-gold 2s infinite;
            color: var(--primary) !important;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        .waitlist-strip {
            flex-shrink: 0;
            text-align: center;
            background: linear-gradient(90deg, rgba(212, 175, 55, 0.22), rgba(212, 175, 55, 0.05), rgba(212, 175, 55, 0.22));
            border-bottom: 1px solid rgba(212, 175, 55, 0.4);
            color: rgba(255, 255, 255, 0.92);
            font-size: 0.82rem;
            padding: 8px 12px;
        }

        .waitlist-strip strong {
            color: var(--primary);
        }

        /* RTL Overrides for International Support */
        [dir="rtl"] .chat-input-area {
            flex-direction: row-reverse;
        }

        [dir="rtl"] .message-content {
            text-align: right;
        }

        [dir="rtl"] .edit-btn {
            border-top-left-radius: 4px;
            border-bottom-left-radius: 4px;
            border-top-right-radius: 0;
            border-bottom-right-radius: 0;
        }

        [dir="rtl"] .edit-btn {
            right: auto;
            left: 10px;
        }
    </style>
</head>

<body>
    <!-- EQ Splash Loader -->
    <div class="eq-loader" id="eqLoader">
        <img src="/static/Eq-logo.png" alt="EQ">
        <div class="loader-bar"><div class="loader-bar-fill"></div></div>
    </div>

    <div class="bg-animation"></div>
    <div class="bg-overlay"></div>
    <div class="chat-container">
        <div class="waitlist-strip">
            🚀 <strong>EQ is a waitlist product</strong> — you're using early access. Chat is free and no account is needed.
        </div>
        <header class="chat-header">
            <span class="logo-text" id="logoInstall" title="Download EQ App" style="cursor: pointer;">EQ</span>
            <div class="header-actions">
                <button class="settings-toggle-btn" onclick="toggleVoiceSettings()" title="Settings">⚙️</button>
                <a href="#" class="logout-link" onclick="sendFeedback(); return false;">Feedback</a>
            </div>
        </header>

        <div class="voice-settings-panel" id="voiceSettingsPanel">
            <div class="settings-header">
                <span>Preferences</span>
                <button onclick="toggleVoiceSettings()"
                    style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="settings-row">
                <span class="settings-label">Language</span>
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">English (US)</option>
                    <option value="pcm">Nigerian Pidgin</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ja">日本語</option>
                    <option value="zh">中文</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="welcome-container" id="welcomeScreen">
                <div class="welcome-glass">
                    <img src="/static/Eq-logo.png" class="logo-image" alt="EQ Logo">
                    <div class="welcome-title">Hello, {{ username }}</div>
                    <div class="welcome-subtitle">I'm EQ, your personal companion. How are you feeling today?</div>
                    <button class="main-call-btn" id="welcomeInstallBtn"
                        style="margin-top: 20px; background: var(--primary); color: #000; border: none; padding: 12px 24px; border-radius: 30px; font-weight: bold; cursor: pointer; display: none;">
                        Download EQ App 📲
                    </button>
                </div>
            </div>
        </div>

        <div class="file-indicator" id="fileIndicator">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                <polyline points="13 2 13 9 20 9"></polyline>
            </svg>
            <span id="fileName"></span>
            <button onclick="clearFile()"
                style="background:none;border:none;color:inherit;cursor:pointer;">&times;</button>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <button class="action-button" id="uploadBtn" title="Upload File">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                    </svg>
                </button>
                <input type="file" id="fileInput" hidden>

                <input type="text" class="chat-input" id="userInput" placeholder="Type a message..." autocomplete="off">

                <button class="send-button" id="sendButton">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
            <!-- Removed Voice Call Wrapper from here -->
        </div>
    </div>



    <script>
        // Pass server-side variables to static JS
        window.EQ_USER = {
            username: "{{ username }}",
            email: "{{ email }}"
        };
    </script>
    <script src="/static/translations.js"></script>
    <script src="/static/eq_app_logic.js"></script>
    <script>
        // Dismiss the EQ loader after page is ready
        window.addEventListener('load', () => {
            setTimeout(() => {
                const loader = document.getElementById('eqLoader');
                if (loader) loader.classList.add('hidden');
            }, 2000);
        });
    </script>
</body>

</html>
