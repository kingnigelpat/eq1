<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sign Up - EQ</title>
    <link rel="icon" href="/static/RAE-removebg-preview.png" type="image/png">
    <link rel="stylesheet" href="/static/eq_style.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: url('/static/background_static.jpg') no-repeat center center;
            background-size: cover;
            animation: kenburns 30s ease-in-out infinite alternate;
            filter: brightness(0.4);
        }

        @keyframes kenburns {
            0% {
                transform: scale(1);
            }

            100% {
                transform: scale(1.15);
            }
        }

        .signup-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .avatar {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, rgba(212, 175, 55, 0.2), rgba(0, 0, 0, 0));
            border: 1px solid rgba(212, 175, 55, 0.3);
            color: #D4AF37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 1.2rem;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 30px rgba(212, 175, 55, 0.1);
        }

        h2 {
            color: #fff;
            margin-bottom: 0.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 480px) {
            .signup-container {
                padding: 2rem 1.5rem;
                border-radius: 16px;
                max-width: 90%;
            }

            .avatar {
                width: 60px;
                height: 60px;
                font-size: 1rem;
            }

            h2 {
                font-size: 1.5rem;
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 1rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: #D4AF37;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 4px rgba(212, 175, 55, 0.1);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: #D4AF37;
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.2s, background 0.2s;
        }

        button:hover {
            background: #e5bd3f;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        .footer-links {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .footer-links a {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .footer-links a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .disclaimer {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 1.5rem;
            line-height: 1.4;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="bg-animation"></div>

    <div class="signup-container">
        <div class="avatar">EQ</div>
        <h2>Create Account</h2>
        <p class="subtitle">Join EQ and start your journey.</p>

        <form id="signupForm">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="email" name="email" placeholder="Email Address" required autocomplete="email">
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required autocomplete="new-password">
            </div>
            <button type="submit" id="submitBtn">Create Account</button>
        </form>

        <div class="footer-links">
            <p>Already have an account? <a href="/login">Sign In</a></p>
        </div>

        <p class="disclaimer">
            <strong>Privacy Notice:</strong> Conversations are temporary and not permanently stored.
        </p>
    </div>

    <script>
        const signupForm = document.getElementById('signupForm');
        const submitBtn = document.getElementById('submitBtn');

        signupForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            submitBtn.textContent = "Creating Account...";
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";

            const formData = new FormData(signupForm);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/signup', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    Swal.fire({
                        icon: 'success',
                        title: 'Welcome!',
                        text: 'Account created successfully. Redirecting...',
                        timer: 1500,
                        showConfirmButton: false,
                        background: '#111',
                        color: '#fff',
                        iconColor: '#D4AF37'
                    }).then(() => {
                        window.location.href = result.redirect;
                    });
                } else {
                    Swal.fire({
                        icon: 'error',
                        title: 'Registration Failed',
                        text: result.message || 'Something went wrong.',
                        background: '#111',
                        color: '#fff',
                        confirmButtonText: 'Try Again'
                    });

                    submitBtn.textContent = "Create Account";
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = "1";
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Connection Error',
                    text: 'Could not connect to the server.',
                    background: '#111',
                    color: '#fff',
                });
                submitBtn.textContent = "Create Account";
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            }
        });
    </script>
</body>

</html>
