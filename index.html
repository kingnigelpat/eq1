<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EQ - Your Emotional Companion</title>
    <link rel="icon" href="/static/RAE-removebg-preview.png" type="image/png">
    <link rel="stylesheet" href="/static/eq_style.css">
    <link rel="manifest" href="/static/manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script>
        // Check if running as a standalone app
        window.isAppInstalled = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/sw.js')
                    .then(reg => console.log('SW Registered', reg))
                    .catch(err => console.log('SW Error', err));
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        @keyframes pulse-gold {
            0% {
                transform: scale(1);
                text-shadow: 0 0 5px var(--primary);
            }

            50% {
                transform: scale(1.15);
                text-shadow: 0 0 25px var(--primary);
            }

            100% {
                transform: scale(1);
                text-shadow: 0 0 5px var(--primary);
            }
        }

        .install-ready {
            animation: pulse-gold 2s infinite;
            color: var(--primary) !important;
            filter: drop-shadow(0 0 8px var(--primary));
        }

        /* RTL Overrides for International Support */
        [dir="rtl"] .user-message {
            border-bottom-right-radius: 18px;
            border-bottom-left-radius: 4px;
            padding-right: 16px;
            padding-left: 35px;
        }

        [dir="rtl"] .eq-message {
            border-bottom-left-radius: 18px;
            border-bottom-right-radius: 4px;
        }

        [dir="rtl"] .edit-btn {
            right: auto;
            left: 10px;
        }
    </style>
</head>

<body>
    <div class="bg-animation"></div>
    <div class="bg-overlay"></div>
    <div class="chat-container">
        <header class="chat-header">
            <span class="logo-text" id="logoInstall" title="Download EQ App" style="cursor: pointer;">EQ</span>
            <div class="header-actions">
                <button class="settings-toggle-btn" onclick="toggleVoiceSettings()" title="Settings">⚙️</button>
                <a href="#" class="logout-link" onclick="sendFeedback(); return false;">Feedback</a>
                <a href="/logout" class="logout-link" onclick="localStorage.removeItem('eq_user_id');">Logout</a>
            </div>
        </header>

        <div class="voice-settings-panel" id="voiceSettingsPanel">
            <div class="settings-header">
                <span>Preferences</span>
                <button onclick="toggleVoiceSettings()"
                    style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer;">&times;</button>
            </div>
            <div class="settings-row">
                <span class="settings-label">Language</span>
                <select id="langSelect" onchange="changeLanguage(this.value)">
                    <option value="en">English (US)</option>
                    <option value="pcm">Nigerian Pidgin</option>
                    <option value="es">Español</option>
                    <option value="fr">Français</option>
                    <option value="de">Deutsch</option>
                    <option value="ja">日本語</option>
                    <option value="zh">中文</option>
                    <option value="ar">العربية</option>
                </select>
            </div>
        </div>

        <div class="chat-messages" id="chat-messages">
            <div class="welcome-container" id="welcomeScreen">
                <div class="welcome-glass">
                    <img src="/static/RAE-removebg-preview.png" class="logo-image" alt="EQ Logo">
                    <div class="welcome-title">Hello, {{ username }}</div>
                    <div class="welcome-subtitle">I'm EQ, your personal companion. How are you feeling today?</div>
                    <button class="main-call-btn" id="welcomeInstallBtn"
                        style="margin-top: 20px; background: var(--primary); color: #000; border: none; padding: 12px 24px; border-radius: 30px; font-weight: bold; cursor: pointer; display: none;">
                        Download EQ App 📲
                    </button>
                </div>
            </div>
        </div>

        <div class="file-indicator" id="fileIndicator">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                <polyline points="13 2 13 9 20 9"></polyline>
            </svg>
            <span id="fileName"></span>
            <button onclick="clearFile()"
                style="background:none;border:none;color:inherit;cursor:pointer;">&times;</button>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <button class="action-button" id="uploadBtn" title="Upload File">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                    </svg>
                </button>
                <input type="file" id="fileInput" hidden>

                <input type="text" class="chat-input" id="userInput" placeholder="Type a message..." autocomplete="off">

                <button class="action-button" id="micBtn" title="Voice Input">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                        <path
                            d="M17 11c0 3.01-2.44 5.5-5.5 5.5S6 14.01 6 11H4c0 3.53 2.61 6.43 6 6.92V21h4v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                    </svg>
                </button>

                <button class="send-button" id="sendButton">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
            <!-- Removed Voice Call Wrapper from here -->
        </div>
    </div>

    <!-- Voice Overlay -->
    <!-- Removed FAB Call Button as requested -->

    <!-- Voice Overlay -->
    <div class="voice-overlay" id="voiceOverlay">
        <button class="mute-voice-btn" id="muteBtn" onclick="toggleMute()" title="Mute Microphone">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                <path
                    d="M17 11c0 3.01-2.44 5.5-5.5 5.5S6 14.01 6 11H4c0 3.53 2.61 6.43 6 6.92V21h4v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
            </svg>
        </button>
        <button class="voice-settings-btn" onclick="toggleVoiceSettings()">⚙️</button>

        <div class="voice-status" id="voiceStatus">Listening...</div>

        <div class="voice-visualizer" id="voiceVisualizer" onclick="activateVoiceOnMobile()" style="cursor: pointer;">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
            </svg>
            <div class="waveform-container">
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
            </div>
        </div>

        <div id="voiceTranscript"
            style="max-width:80%; text-align:center; margin-bottom:30px; min-height:24px; color:rgba(255,255,255,0.7);">
        </div>

        <button class="action-button" id="voiceSendBtn"
            style="width:60px; height:60px; background:var(--primary); margin-bottom:30px; display:none;">
            <svg viewBox="0 0 24 24" style="width:30px; height:30px; fill:#000;">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
        </button>

        <button class="close-voice-btn" onclick="endVoiceCall()">End Call</button>
    </div>

        let voiceCallUtterance = null;
        let voices = [];

        let typingInterval = null; // Timer for text typing effect
        let isMuted = false;
        let savedTranscript = "";
        let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        // --- Elements ---
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const micBtn = document.getElementById('micBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileIndicator = document.getElementById('fileIndicator');
        const fileNameSpan = document.getElementById('fileName');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const langSelect = document.getElementById('langSelect');
        const voiceSettingsPanel = document.getElementById('voiceSettingsPanel');
        const voiceOverlay = document.getElementById('voiceOverlay');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceVisualizer = document.getElementById('voiceVisualizer');
        const voiceTranscript = document.getElementById('voiceTranscript');
        const voiceSendBtn = document.getElementById('voiceSendBtn');

        // --- Internationalization ---
        const MESSAGES_I18N = {

                start_voice: "بدء الدردشة الصوتية",
                type_placeholder: "اكتب رسالة...",

                mic_listening: "استماع... (اضغط للإيقاف)",

                speaking: "EQ يتحدث...",
                muted: "مكتوم",
                resuming: "استئناف...",
                thinking: "تفكير...",
                end_call: "إنهاء المكالمة",
                test_voice: "اختبار الصوت",
                quota: "تم الوصول إلى الحد",
                access_denied: "تم رفض الوصول للميكروفون",
                tap_to_speak: "اضغط للدائرة للتحدث"
            },
            pcm: {
                welcome: "Afa, {{username}}",
                subtitle: "I be your EQ friend. How you dey feel today?",

                type_placeholder: "Type message for here...",
                listening: "I dey listen...",
                mic_listening: "I dey listen... (Click mic to stop)",
                mic_default: "Talk to EQ...",
                speaking: "EQ dey talk...",
                muted: "Muted",
                resuming: "I dey come back...",
                thinking: "I dey tink...",
                end_call: "End Call",
                test_voice: "Test Voice",
                quota: "Quota Don Finish",
                access_denied: "Mic no gree work",
                tap_to_speak: "Tap circle to talk"
            }
        };

        let currentLang = localStorage.getItem('eq_lang') || 'en';

        function updateUIText() {
            const t = MESSAGES_I18N[currentLang] || MESSAGES_I18N.en;

            // Static Elements
            const welcomeTitle = document.querySelector('.welcome-title');
            if (welcomeTitle) welcomeTitle.innerText = t.welcome.replace('{{username}}', '{{ username }}'); // Logic to preserve username handled by python usually, but here dynamic

            const welcomeSubtitle = document.querySelector('.welcome-subtitle');
            if (welcomeSubtitle) welcomeSubtitle.innerText = t.subtitle;

            const startBtn = document.querySelector('.main-call-btn');
            if (startBtn) startBtn.innerHTML = `<svg viewBox="0 0 24 24"><path d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z" /></svg> ${t.start_voice}`;

            userInput.placeholder = t.type_placeholder;

            const closeBtn = document.querySelector('.close-voice-btn');
            if (closeBtn) closeBtn.innerText = t.end_call;

            const testBtn = document.querySelector('.test-voice-btn');
            if (testBtn) testBtn.innerText = t.test_voice;

            // Update direction for Arabic
            if (currentLang === 'ar') {
                document.body.style.direction = 'rtl';
                document.querySelector('.chat-input-area').style.direction = 'rtl';
            } else {
                document.body.style.direction = 'ltr';
                document.querySelector('.chat-input-area').style.direction = 'ltr';
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('eq_lang', lang);
            updateUIText();
        }

        // --- Feedback Function ---
        function sendFeedback() {
            Swal.fire({
                title: 'Share Your Thoughts',
                text: "EQ loves hearing from you. What's on your mind?",
                input: 'textarea',
                inputPlaceholder: 'Type your feedback here...',
                showCancelButton: true,
                confirmButtonText: 'Send to EQ',
                confirmButtonColor: 'var(--primary)',
                cancelButtonColor: '#333',
                background: '#111',
                color: '#fff',
                customClass: {
                    input: 'swal-custom-textarea'
                }
            }).then((result) => {
                if (result.isConfirmed && result.value) {
                    const feedback = result.value;
                    const recipient = 'championsmail18@gmail.com';
                    const userEmail = '{{ email }}';
                    const subject = encodeURIComponent('EQ App Feedback from {{ username }}');
                    const body = encodeURIComponent(`From: ${userEmail}\n\nFeedback:\n${feedback}`);
                    window.location.href = `mailto:${recipient}?subject=${subject}&body=${body}`;
                    Swal.fire({
                        title: 'Thank You!',
                        text: 'Your feedback makes EQ better.',
                        icon: 'success',
                        timer: 2000,
                        showConfirmButton: false,
                        background: '#111',
                        color: '#fff'
                    });
                }
            });
        }

        // --- Voice Logic ---
        const voiceOptions = [
            { name: "English (Male)", id: "male-premium", type: "premium", locale: "en-US" },
            { name: "English (Female)", id: "female-premium", type: "premium", locale: "en-US" },
            { name: "Pidgin (Nigeria)", id: "pidgin-premium", type: "premium", locale: "en-NG" },
            { name: "Español (Hombre)", id: "es-ES-Male", type: "premium", locale: "es-ES" },
            { name: "Español (Mujer)", id: "es-ES-Female", type: "premium", locale: "es-ES" },
            { name: "Français (Homme)", id: "fr-FR-Male", type: "premium", locale: "fr-FR" },
            { name: "Français (Femme)", id: "fr-FR-Female", type: "premium", locale: "fr-FR" },
            { name: "Deutsch (Mann)", id: "de-DE-Male", type: "premium", locale: "de-DE" },
            { name: "Deutsch (Frau)", id: "de-DE-Female", type: "premium", locale: "de-DE" },
            { name: "日本語 (男性)", id: "ja-JP-Male", type: "premium", locale: "ja-JP" },
            { name: "日本語 (女性)", id: "ja-JP-Female", type: "premium", locale: "ja-JP" },
            { name: "中文 (男)", id: "zh-CN-Male", type: "premium", locale: "zh-CN" },
            { name: "中文 (女)", id: "zh-CN-Female", type: "premium", locale: "zh-CN" },
            { name: "العربية (رجل)", id: "ar-SA-Male", type: "premium", locale: "ar-SA" },
            { name: "العربية (امرأة)", id: "ar-SA-Female", type: "premium", locale: "ar-SA" },
        ];

        // Language handling
        langSelect.addEventListener('change', () => {
            currentLang = langSelect.value;
            localStorage.setItem('eq_lang', currentLang);
            updateI18N();

            if (isVoiceCallActive && recognition) {
                try { recognition.stop(); } catch (e) { }
                voiceStatus.innerText = "Switching language...";
                setTimeout(startListening, 800);
            }
        });

        function toggleVoiceSettings() {
            voiceSettingsPanel.classList.toggle('active');
            voiceSettingsPanel.style.display = voiceSettingsPanel.classList.contains('active') ? 'flex' : 'none';
        }

        window.toggleMute = function () {
            isMuted = !isMuted;
            const btn = document.getElementById('muteBtn');
            const visualizer = document.getElementById('voiceVisualizer');
            if (isMuted) {
                clearTimeout(silenceTimer);
                savedTranscript = userInput.value.trim();
                btn.classList.add('muted');
                visualizer.classList.add('muted');
                btn.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zm-4.02.17c0-.06.02-.11.02-.17V5c0-1.66-1.34-3-3-3S9 3.34 9 5v.18l5.98 5.99zM4.27 3L3 4.27l6.01 6.01V11c0 1.66 1.33 3 2.99 3 .22 0 .44-.03.65-.08l2.97 2.97c-.85.35-1.76.57-2.73.57-3.01 0-5.5-2.45-5.5-5.5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c.57-.08 1.12-.24 1.64-.46L19.73 22 21 20.73 4.27 3z"/></svg>`;
                voiceStatus.innerText = (MESSAGES_I18N[currentLang] || MESSAGES_I18N.en).muted;
                voiceVisualizer.style.opacity = '0.3';
                if (recognition) recognition.stop();
            } else {
                btn.classList.remove('muted');
                visualizer.classList.remove('muted');
                btn.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" /><path d="M17 11c0 3.01-2.44 5.5-5.5 5.5S6 14.01 6 11H4c0 3.53 2.61 6.43 6 6.92V21h4v-3.08c3.39-.49 6-3.39 6-6.92h-2z" /></svg>`;
                voiceStatus.innerText = (MESSAGES_I18N[currentLang] || MESSAGES_I18N.en).resuming;
                voiceVisualizer.style.opacity = '1';
                setTimeout(startListening, 300);
            }
        };

        function startListening() {
            if (!recognition || isMuted) return;
            try {
                const localeMap = { 'pcm': 'en-NG', 'es': 'es-ES', 'fr': 'fr-FR', 'de': 'de-DE', 'ja': 'ja-JP', 'zh': 'zh-CN', 'ar': 'ar-SA' };
                recognition.lang = localeMap[currentLang] || 'en-US';
                if (window.speechSynthesis) { window.speechSynthesis.pause(); window.speechSynthesis.resume(); }
                recognition.start();
                voiceStatus.innerText = (MESSAGES_I18N[currentLang] || MESSAGES_I18N.en).listening;
                voiceVisualizer.style.opacity = '1';
                voiceVisualizer.classList.remove('speaking');
            } catch (e) { }
        }



        window.testVoice = function () {
            speak("This is how I sound.", null, true);
        };



        function speak(text, onEndCallback, isTest) {
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            // Visualizer Reset
            voiceVisualizer.classList.remove('speaking');

            // Regex to remove emojis (most common ranges)
            const noEmojiText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');

            const textToSpeak = noEmojiText.replace(/[*#`_]/g, '')
                .replace(/!\[.*?\]\(.*?\)/g, ' I have generated an image. ')
                .replace(/\[DOWNLOAD:.*?\]/g, ' File ready. ');

            const type = 'premium';
            const voiceId = currentLang === 'pcm' ? 'pcm-premium' : 'male-premium';

            if (type === 'premium') {
                // Server-Side Edge TTS
                if (isVoiceCallActive || isTest) {
                    if (!isTest) voiceStatus.innerText = "...";
                    // Animation deferred until playback starts
                    if (!isTest) {
                        // Show what AI is saying in the transcript area
                        // voiceTranscript.innerText = text; // Disabled for typing effect
                        voiceTranscript.innerText = "";
                        voiceSendBtn.style.display = 'none';
                    }
                }

                fetch('/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textToSpeak, voice: voiceId })
                })

                    .then(async response => {
                        if (!response.ok) {
                            try {
                                const errData = await response.json();
                                throw new Error(errData.error || 'TTS Failed');
                            } catch (e) { throw new Error('TTS Failed'); }
                        }
                        return response.blob();
                    })
                    .then(blob => {
                        const audioUrl = URL.createObjectURL(blob);
                        currentAudio = new Audio(audioUrl);
                        currentAudio.playbackRate = 1.0;

                        currentAudio.onplay = () => {
                            if (isVoiceCallActive || isTest) {
                                voiceVisualizer.classList.add('speaking');
                                if (!isTest) {
                                    voiceStatus.innerText = MESSAGES_I18N[currentLang].speaking;
                                    // Start synced typing
                                    const duration = currentAudio.duration && isFinite(currentAudio.duration) ? currentAudio.duration : (text.length * 0.06);
                                    startTypingEffect(text, duration);
                                }
                            }
                        };

                        currentAudio.onended = () => {
                            voiceVisualizer.classList.remove('speaking');
                            if (isVoiceCallActive && !isTest) {
                                voiceStatus.innerText = MESSAGES_I18N[currentLang].listening;
                            }
                            if (onEndCallback) onEndCallback();
                        };

                        currentAudio.play();
                    })
                    .catch(err => {
                        if (err.message && err.message.includes('Credit limit')) {
                            alert(MESSAGES_I18N[currentLang].quota);
                            voiceStatus.innerText = MESSAGES_I18N[currentLang].quota;
                            voiceVisualizer.style.opacity = '0.5';
                            // Ensure no further processing
                            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
                        } else {
                            console.error("Premium Voice Failed, falling back to system:", err);
                            speakSystem(textToSpeak, onEndCallback, isTest);
                        }
                    });
            } else {
                speakSystem(textToSpeak, onEndCallback, isTest);
            }
        }

        function speakSystem(text, onEndCallback, isTest) {
            if (!window.speechSynthesis) {
                if (onEndCallback) onEndCallback();
                return;
            }
            if (voices.length === 0) voices = window.speechSynthesis.getVoices();

            const utterance = new SpeechSynthesisUtterance(text);
            voiceCallUtterance = utterance;

            const gender = currentLang === 'pcm' ? 'male' : 'neutral';

            let targetVoice = null;
            if (gender === 'female') {
                targetVoice = voices.find(v => v.name.includes('Zira') || v.name.includes('Google US English') || v.name.includes('Samantha') || v.name.includes('Female'));
            } else {
                // Prioritize David (Windows) or Alex (Apple US)
                targetVoice = voices.find(v => v.name.includes('David') || v.name.includes('Alex'));

                // Fallback to Daniel (British) or generic Male
                if (!targetVoice) targetVoice = voices.find(v => v.name.includes('Daniel') || v.name.includes('Male'));
            }

            if (targetVoice) utterance.voice = targetVoice;
            else utterance.voice = voices.find(v => v.lang.startsWith('en')) || voices[0];

            utterance.rate = 1.0;
            utterance.pitch = 1.0;

            utterance.onstart = () => {
                if (isVoiceCallActive || isTest) {
                    if (!isTest) voiceStatus.innerText = "EQ Speaking...";
                    voiceVisualizer.classList.add('speaking');
                    if (!isTest) {
                        voiceTranscript.innerText = text;  // Show text on screen
                        voiceSendBtn.style.display = 'none';
                    }
                }
            };

            utterance.onend = () => {
                if (isVoiceCallActive || isTest) {
                    voiceVisualizer.classList.remove('speaking');
                    if (onEndCallback) onEndCallback();
                }
            };

            utterance.onerror = (e) => {
                if (isVoiceCallActive) {
                    voiceVisualizer.classList.remove('speaking');
                    if (onEndCallback) onEndCallback();
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // --- Recognition Setup ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                if (isVoiceCallActive) {
                    voiceStatus.innerText = MESSAGES_I18N[currentLang].listening;
                    voiceTranscript.innerText = savedTranscript || ""; // Restore text if any
                    voiceSendBtn.style.display = 'flex';
                    voiceSendBtn.style.opacity = '1';
                } else {
                    micBtn.classList.add('recording');
                    userInput.placeholder = MESSAGES_I18N[currentLang].mic_listening;
                }
            };

            recognition.onerror = (event) => {
                if (isVoiceCallActive) {
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        voiceStatus.innerText = MESSAGES_I18N[currentLang].access_denied;
                        alert("Please allow microphone access.");
                    } else {
                        voiceStatus.innerText = MESSAGES_I18N[currentLang].tap_to_speak;
                        voiceVisualizer.style.opacity = '0.5';
                    }
                }
            };

            recognition.onend = () => {
                micBtn.classList.remove('recording');
                userInput.placeholder = MESSAGES_I18N[currentLang].mic_default;
                if (isVoiceCallActive && !window.blockRestart) {
                    setTimeout(() => {
                        // Check both System and Premium audio status
                        const isSystemSpeaking = window.speechSynthesis.speaking;
                        const isPremiumSpeaking = currentAudio && !currentAudio.paused;

                        if (isVoiceCallActive && !isSystemSpeaking && !isPremiumSpeaking && !isMuted) {
                            try { recognition.start(); } catch (e) {
                                console.log("Restart error:", e);
                                if (!isMuted) {
                                    voiceStatus.innerText = MESSAGES_I18N[currentLang].tap_to_speak;
                                    voiceVisualizer.style.opacity = '0.5';
                                }
                            }
                        }
                    }, 300);
                }
            };

            recognition.onresult = (event) => {
                let fullTranscript = '';
                for (let i = 0; i < event.results.length; i++) {
                    fullTranscript += event.results[i][0].transcript;
                }

                if (isVoiceCallActive) {
                    // Combine saved transcript (from before mute) with new transcript
                    const combinedText = (savedTranscript ? savedTranscript + ' ' : '') + fullTranscript;

                    voiceTranscript.innerText = combinedText;
                    userInput.value = combinedText;

                    // Auto-Send on Silence (but only if we have NEW input in this session or combined len grew)
                    clearTimeout(silenceTimer);

                    // Only start timer if we are NOT muted (redundant check but safe)
                    if (!isMuted && fullTranscript.trim().length > 0) {
                        silenceTimer = setTimeout(() => {
                            // Trigger Send Logic
                            window.blockRestart = true;
                            recognition.stop();
                            voiceStatus.innerText = "...";
                            handleSend();
                        }, 6000);
                    }
                } else {
                    userInput.value = fullTranscript;
                }
            };

            micBtn.addEventListener('click', () => {
                if (isVoiceCallActive) return;
                if (micBtn.classList.contains('recording')) {
                    recognition.stop();
                } else {
                    recognition.start();
                    userInput.value = '';
                }
            });

            // voiceCallBtn.addEventListener('click', startVoiceCall);

            // Expose globally for the main button
            window.startVoiceCall = startVoiceCall;

            function startVoiceCall() {
                isVoiceCallActive = true;
                window.blockRestart = false;
                voiceOverlay.classList.add('active');

                // Hide FAB when call starts
                const fab = document.getElementById('fabCallBtn');
                if (fab) fab.classList.remove('visible');

                // iOS Wakeup
                if (window.speechSynthesis) {
                    const dummy = new SpeechSynthesisUtterance('');
                    dummy.volume = 0;
                    window.speechSynthesis.speak(dummy);
                    window.speechSynthesis.cancel();
                }

                if (recognition && recognition.abort) recognition.abort();
                setTimeout(() => {
                    userInput.value = '';
                    savedTranscript = ''; // Reset saved text on new call
                    startListening();
                }, 500);
            }

            voiceSendBtn.addEventListener('click', () => {
                if (!isVoiceCallActive) return;
                const text = userInput.value.trim();
                if (!text) return;
                window.blockRestart = true;
                recognition.stop();
                window.blockRestart = true;
                recognition.stop();
                savedTranscript = ''; // Clear saved since we sent it
                voiceStatus.innerText = MESSAGES_I18N[currentLang].thinking;
                handleSend();
            });

            window.endVoiceCall = function () {
                isVoiceCallActive = false;
                window.blockRestart = true;

                // Reset Mute State
                isMuted = false;
                savedTranscript = '';  // Clear
                const visualizer = document.getElementById('voiceVisualizer');
                const btn = document.getElementById('muteBtn'); // Define btn
                if (btn) {
                    btn.classList.remove('muted');
                    btn.innerHTML = `<svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" /><path d="M17 11c0 3.01-2.44 5.5-5.5 5.5S6 14.01 6 11H4c0 3.53 2.61 6.43 6 6.92V21h4v-3.08c3.39-.49 6-3.39 6-6.92h-2z" /></svg>`;
                }
                if (visualizer) visualizer.classList.remove('muted');

                clearTimeout(silenceTimer); // Clear timer
                clearInterval(typingInterval); // Clear typing effect
                voiceOverlay.classList.remove('active');

                // Show FAB when call ends
                const fab = document.getElementById('fabCallBtn');
                if (fab) fab.classList.add('visible');
                if (recognition) recognition.abort();
                window.speechSynthesis.cancel();
            };

        } else {
            micBtn.style.display = 'none';
        }

        // --- Chat Logic ---
        function removeWelcomeScreen() {
            if (welcomeScreen && welcomeScreen.parentNode) {
                welcomeScreen.parentNode.removeChild(welcomeScreen);
            }
        }

        function parseMarkdown(text) {
            let html = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" style="color:var(--primary); text-decoration:underline;">$1</a>');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
            html = html.replace(/\[DOWNLOAD:\s*([^\]]+)\]/g, (match, filename) => {
                return `<button onclick="downloadCode(this, '${filename.trim()}')" style="margin-top:8px;padding:6px 12px;background:var(--primary);border:none;border-radius:4px;cursor:pointer;color:#000;font-weight:500;">Download ${filename.trim()}</button>`;
            });
            return html;
        }

        window.downloadCode = function (btn, filename) {
            const messageDiv = btn.closest('.message');
            let pre = null;
            const pres = messageDiv.querySelectorAll('pre');
            if (pres.length > 0) pre = pres[pres.length - 1];

            if (!pre) { alert("Could not find content"); return; }
            const content = pre.textContent;

            if (filename.toLowerCase().endsWith('.pdf')) {
                if (!window.jspdf) { alert("Loading PDF engine..."); return; }
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();

                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(12);

                    const pageWidth = doc.internal.pageSize.getWidth();
                    const pageHeight = doc.internal.pageSize.getHeight();
                    const margin = 20;
                    const maxLineWidth = pageWidth - (margin * 2);

                    const splitText = doc.splitTextToSize(content, maxLineWidth);

                    let y = 20;
                    const lineHeight = 7;

                    for (let i = 0; i < splitText.length; i++) {
                        if (y + lineHeight > pageHeight - margin) {
                            doc.addPage();
                            y = 20;
                        }
                        doc.text(splitText[i], margin, y);
                        y += lineHeight;
                    }

                    doc.save(filename);
                } catch (e) { alert("Error: " + e.message); }
            } else {
                const blob = new Blob([content], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename; a.click();
            }
        };

        function addUserMessage(text) {
            removeWelcomeScreen();

            // Remove edit buttons from previous messages
            const prevEditBtns = chatMessages.querySelectorAll('.edit-btn');
            prevEditBtns.forEach(btn => btn.remove());

            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';

            // Text Content Wrapper
            const contentSpan = document.createElement('div');
            contentSpan.className = 'message-content';
            if (currentFileName) text += `\n[Attached: ${currentFileName}]`;
            contentSpan.innerText = text;
            messageDiv.appendChild(contentSpan);

            // Edit Button
            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.innerHTML = '✎';
            editBtn.title = "Edit Message";
            editBtn.onclick = () => enableEditMode(messageDiv, text);
            messageDiv.appendChild(editBtn);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function enableEditMode(messageDiv, oldText) {
            // contentSpan might have attachment info, strip it for editing if wanted, 
            // but for simplicity let's edit the full raw text displayed.
            // Actually, we pass 'text' (which includes [Attached...]) to this function.

            const originalContent = messageDiv.innerHTML; // Backup

            messageDiv.innerHTML = ''; // Clear
            const container = document.createElement('div');
            container.className = 'edit-container';

            const textarea = document.createElement('textarea');
            textarea.className = 'edit-textarea';
            textarea.value = oldText;
            textarea.rows = 3;

            const actions = document.createElement('div');
            actions.className = 'edit-actions';

            const saveBtn = document.createElement('button');
            saveBtn.className = 'edit-actions button save-btn';
            saveBtn.innerText = 'Save & Submit';
            saveBtn.onclick = () => saveEdit(messageDiv, textarea.value);

            const cancelBtn = document.createElement('button');
            cancelBtn.className = 'edit-actions button cancel-btn';
            cancelBtn.innerText = 'Cancel';
            cancelBtn.onclick = () => {
                messageDiv.innerHTML = originalContent; // Restore
                // Re-bind click event because innerHTML nuked it
                const btn = messageDiv.querySelector('.edit-btn');
                if (btn) btn.onclick = () => enableEditMode(messageDiv, oldText);
            };

            actions.appendChild(cancelBtn);
            actions.appendChild(saveBtn);

            container.appendChild(textarea);
            container.appendChild(actions);
            messageDiv.appendChild(container);
            textarea.focus();
            // Cursor at end
            textarea.setSelectionRange(textarea.value.length, textarea.value.length);

            // Handle Enter key (Ctrl+Enter to save)
            textarea.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
                    saveEdit(messageDiv, textarea.value);
                }
                if (e.key === 'Escape') {
                    // Cancel
                    actions.querySelector('.cancel-btn').click();
                }
            });
        }

        function saveEdit(messageDiv, newText) {
            if (!newText.trim()) return;

            // 1. Update UI of this message
            messageDiv.innerHTML = '';
            messageDiv.className = 'message user-message';

            const contentSpan = document.createElement('div');
            contentSpan.className = 'message-content';
            contentSpan.innerText = newText;
            messageDiv.appendChild(contentSpan);

            const editBtn = document.createElement('button');
            editBtn.className = 'edit-btn';
            editBtn.innerHTML = '✎';
            editBtn.title = "Edit Message";
            editBtn.onclick = () => enableEditMode(messageDiv, newText);
            messageDiv.appendChild(editBtn);

            // 2. Remove all subsequent messages
            let nextSibling = messageDiv.nextElementSibling;
            while (nextSibling) {
                const toRemove = nextSibling;
                nextSibling = nextSibling.nextElementSibling;
                toRemove.remove();
            }

            // 3. Re-submit to AI
            eqRespond(newText);
        }

        function addEQMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message eq-message';
            messageDiv.innerHTML = parseMarkdown(text);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';

            const t = MESSAGES_I18N[currentLang] || MESSAGES_I18N.en;
            const textSpan = document.createElement('span');
            textSpan.className = 'typing-text';
            textSpan.innerText = t.thinking || 'Thinking';
            typingDiv.appendChild(textSpan);

            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                typingDiv.appendChild(dot);
            }
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Addiction: Breath the logo while thinking
            const welcomeLogo = document.querySelector('.logo-image');
            if (welcomeLogo) welcomeLogo.style.animation = 'float 2s ease-in-out infinite, shine 2s linear infinite';

            return typingDiv;
        }

        async function eqRespond(userMessage) {
            const typingIndicator = showTyping();
            let prompt = userMessage;
            if (currentFileContent) {
                prompt += `\n\n[USER UPLOADED FILE CONTENT (${currentFileName})]:\n${currentFileContent}`;
                clearFile();
            }

            try {
                let userId = localStorage.getItem('eq_user_id');
                if (!userId) {
                    userId = 'guest_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('eq_user_id', userId);
                }
                // Voice logic simplified
                const currentVoiceId = currentLang === 'pcm' ? 'pcm-premium' : 'male-premium';

                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: prompt,
                        user_id: userId,
                        voice_id: currentVoiceId,
                        language: currentLang === 'pcm' ? 'pidgin' : (currentLang === 'en' ? 'english' : currentLang),
                        local_time: new Date().toLocaleString()
                    })
                });

                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }

                const data = await res.json();

                if (typingIndicator.parentNode) chatMessages.removeChild(typingIndicator);

                // Logo back to normal
                const welcomeLogo = document.querySelector('.logo-image');
                if (welcomeLogo) welcomeLogo.style.animation = 'float 4s ease-in-out infinite';

                if (data.alert) alert(data.alert);

                addEQMessage(data.response);

                if (isVoiceMode || isVoiceCallActive) {
                    speak(data.response, () => {
                        if (isVoiceCallActive) {
                            window.blockRestart = false;
                            try { startListening(); } catch (e) { }
                        }
                    });
                }
            } catch (error) {
                if (typingIndicator.parentNode) chatMessages.removeChild(typingIndicator);
                const welcomeLogo = document.querySelector('.logo-image');
                if (welcomeLogo) welcomeLogo.style.animation = 'float 4s ease-in-out infinite';
                console.error("Chat Error:", error);
                addEQMessage("Hey — I'm having trouble connecting to the cloud right now ☁️ (" + error.message + ")");
            }
        }

        function handleSend() {
            const message = userInput.value.trim();
            if (message || currentFileContent) {
                addUserMessage(message || "(File Upload)");
                userInput.value = '';
                eqRespond(message || "Analyze this file.");
            }
        }

        sendButton.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                isVoiceMode = false;
                handleSend();
            }
        });

        // Dynamic visibility for Call (FAB) and Send buttons

        // --- File Upload ---

        fileInput.addEventListener('change', async (e) => {

            const formData = new FormData();

                const data = await res.json();

                if (data.error) {

                } else {
                    if (data.full_content && data.full_content.length < 50000) {
                        currentFileContent = data.full_content;

                    fileNameSpan.textContent = data.filename;

        window.clearFile = function () {

        // --- PWA Installation Logic ---
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const logo = document.getElementById('logoInstall');
            if (logo) logo.classList.add('install-ready');
            const welcomeInstallBtn = document.getElementById('welcomeInstallBtn');
            if (welcomeInstallBtn) welcomeInstallBtn.style.display = 'inline-block';

        window.addEventListener('load', () => {
            const logoInstall = document.getElementById('logoInstall');
            const welcomeInstallBtn = document.getElementById('welcomeInstallBtn');

            const triggerInstall = async () => {
                const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;
                if (isStandalone) {
                    Swal.fire({ title: 'EQ App', text: 'You\'re already using the app! 🚀', icon: 'success', confirmButtonColor: 'var(--primary)', background: '#111', color: '#fff' });
                    return;
                }
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    if (outcome === 'accepted') {
                        deferredPrompt = null;
                        if (logoInstall) logoInstall.classList.remove('install-ready');
                    }
                } else {
                    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
                    const msg = isIOS
                        ? "Tap the <b>Share icon</b> 📤 and pick <b>'Add to Home Screen'</b> to install EQ!"
                        : "Look for the <b>Install Icon</b> (🖥️ or ➕) in your browser's <b>Address Bar</b> at the top right!<br><br>Or click 'Install' in your browser's three-dot menu! 💻";

                    Swal.fire({
                        title: 'How to Download EQ',
                        html: msg,
                        icon: 'info',
                        confirmButtonText: 'Got it!',
                        confirmButtonColor: 'var(--primary)',
                        background: '#111',
                        color: '#fff'
                    });
                }
            };

            if (logoInstall) logoInstall.addEventListener('click', triggerInstall);
            if (welcomeInstallBtn) welcomeInstallBtn.addEventListener('click', triggerInstall);

            // Initial FAB check
            const fab = document.getElementById('fabCallBtn');
            const hasText = userInput.value.trim().length > 0;
            if (fab && hasText) fab.classList.add('visible');
        });

        function startTypingEffect(text, durationSeconds) {
            if (!voiceTranscript) return;
            voiceTranscript.innerText = "";
            clearInterval(typingInterval);
            const safeDuration = durationSeconds > 0 ? durationSeconds : 3;
            const totalTime = safeDuration * 1000;
            const charDelay = totalTime / text.length;
            let i = 0;
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    voiceTranscript.textContent += text.charAt(i);
                    i++;
                    voiceTranscript.scrollTop = voiceTranscript.scrollHeight;
                } else {
                    clearInterval(typingInterval);
                }
            }, charDelay);
        }

    </script>
</body>
