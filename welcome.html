<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to EQ</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: #000000;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }

        .container {
            max-width: 600px;
            padding: 2rem;
        }

        .logo-image {
            width: 150px;
            height: auto;
            margin: 0 auto 2rem;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        @keyframes pulse {
            0% {
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4);
            }

            70% {
                box-shadow: 0 0 0 20px rgba(212, 175, 55, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0);
            }
        }

        h1 {
            font-size: 3rem;
            color: #D4AF37;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .btn-primary {
            background-color: #D4AF37;
            color: #000;
            border: 2px solid #D4AF37;
        }

        .btn-primary:hover {
            background-color: #AA8C2C;
            border-color: #AA8C2C;
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            color: #D4AF37;
            border: 2px solid #D4AF37;
        }

        .btn-outline:hover {
            background-color: rgba(212, 175, 55, 0.1);
            transform: translateY(-2px);
        }

        .disclaimer {
            font-size: 0.8rem;
            color: #666;
            margin-top: 2rem;
            border-top: 1px solid #333;
            padding-top: 1rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Rae Logo -->
        <img src="/static/RAE-removebg-preview.png" alt="RAE Logo" class="logo-image">

        <h1>EQ</h1>
        <p class="subtitle">
            Your emotional companion.<br>
            Always here to listen, understand, and support you.
        </p>

        <div class="btn-group">
            <a href="/login" class="btn btn-primary">Login</a>
            <a href="/signup" class="btn btn-outline">Sign Up</a>
        </div>

        <p class="disclaimer">
            <strong>Privacy Notice:</strong> This is a real-time chat service.
            Conversations are temporary and not permanently stored.
        </p>
    </div>
</body>

</html>
