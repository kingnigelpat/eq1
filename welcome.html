<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to EQ</title>
    <link rel="icon" href="/static/RAE-removebg-preview.png" type="image/png">
    <link rel="stylesheet" href="/static/eq_style.css">
    <style>
        body {
            /* Override eq_style.css defaults if needed */
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            display: block;
            /* eq_style sets flex column, which is fine, but we need formatting */
            /* Ensure background is transparent so animation shows */
            background: transparent;
        }

        /* Ensure specific container styling for welcome page */
        .welcome-content-container {
            max-width: 600px;
            padding: 2rem;
            margin: 0 auto;
            position: relative;
            z-index: 1;
            /* Above overlay */
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .logo-image {
            width: 150px;
            height: auto;
            margin: 0 auto 2rem;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.4));
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

            100% {
                transform: translateY(0px);
            }
        }

        h1 {
            font-size: 3rem;
            color: #D4AF37;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #ccc;
            margin-bottom: 3rem;
            line-height: 1.6;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            margin-bottom: 3rem;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
            font-size: 1.1rem;
        }

        .btn-primary {
            background-color: #D4AF37;
            color: #000;
            border: 2px solid #D4AF37;
        }

        .btn-primary:hover {
            background-color: #AA8C2C;
            border-color: #AA8C2C;
            transform: translateY(-2px);
        }

        .btn-outline {
            background-color: transparent;
            color: #D4AF37;
            border: 2px solid #D4AF37;
        }

        .btn-outline:hover {
            background-color: rgba(212, 175, 55, 0.1);
            transform: translateY(-2px);
        }

        .disclaimer {
            font-size: 0.8rem;
            color: #666;
            margin-top: 2rem;
            border-top: 1px solid #333;
            padding-top: 1rem;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
        }

        /* Main Call Button on Welcome specific logic provided previously logic was in eq_ui... 
           Since this is a simple HTML page, we don't have JS here to start calls unless we link it.
           But the user asked for "Voice chat with AI" text.
        */
    </style>
</head>

<body>
    <!-- Background Animation (from eq_style.css) -->
    <div class="bg-animation"></div>
    <div class="bg-overlay"></div>

    <div class="welcome-content-container">
        <!-- Rae Logo -->
        <img src="/static/RAE-removebg-preview.png" alt="RAE Logo" class="logo-image">

        <h1>EQ</h1>
        <p class="subtitle">
            Your emotional companion.<br>
            Voice chat with AI to express how you feel.
        </p>

        <div class="btn-group">
            <a href="/login" class="btn btn-primary">Login</a>
            <a href="/signup" class="btn btn-outline">Sign Up</a>
        </div>

        <p class="disclaimer">
            <strong>Privacy Notice:</strong> This is a real-time chat service.
            Conversations are temporary and not permanently stored.
        </p>
    </div>
</body>

</html>
