<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Login - EQ</title>
    <link rel="icon" href="/static/RAE-removebg-preview.png" type="image/png">
    <link rel="stylesheet" href="/static/eq_style.css">
    <link rel="manifest" href="/static/manifest.json">
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/static/sw.js');
            });
        }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #000;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
        }

        /* Improved Background */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -2;
            background: url('/static/ethereal_aurora_bg.png') no-repeat center center;
            background-size: cover;
            filter: brightness(0.6) saturate(1.2);
        }

        .bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: radial-gradient(circle at 50% 50%, transparent, #020617);
        }

        .login-container {
            background: rgba(20, 20, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2.5rem;
            border-radius: 24px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                transform: translateY(40px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .logo-image {
            width: 120px;
            height: auto;
            margin: 0 auto 1.5rem;
            filter: drop-shadow(0 0 15px var(--primary-glow));
        }

        h2 {
            color: #fff;
            margin-bottom: 0.5rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            margin-bottom: 2rem;
        }

        @media (max-width: 480px) {
            .login-container {
                padding: 2rem 1.5rem;
                border-radius: 16px;
                max-width: 90%;
            }

            h2 {
                font-size: 1.5rem;
            }

            .avatar {
                width: 60px;
                height: 60px;
                font-size: 1.2rem;
            }
        }

        .input-group {
            position: relative;
            margin-bottom: 1.25rem;
            text-align: left;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.2s;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            background: rgba(0, 0, 0, 0.6);
            box-shadow: 0 0 0 4px var(--primary-glow);
        }

        input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        button {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: #000;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        button:hover {
            background: #e5bd3f;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(212, 175, 55, 0.3);
        }

        button:active {
            transform: scale(0.98);
        }

        .footer-links {
            margin-top: 2rem;
            font-size: 0.9rem;
            color: rgba(255, 255, 255, 0.5);
        }

        .footer-links a {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 500;
            transition: opacity 0.2s;
        }

        .footer-links a:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* SweetAlert Customization */
        div:where(.swal2-container) div:where(.swal2-popup) {
            background: rgba(20, 20, 20, 0.95) !important;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px !important;
        }

        div:where(.swal2-title),
        div:where(.swal2-html-container) {
            color: #fff !important;
        }

        div:where(.swal2-confirm) {
            background-color: var(--primary) !important;
            color: #000 !important;
            border-radius: 10px !important;
            font-weight: 600 !important;
        }
    </style>
</head>

<body>
    <div class="bg-animation"></div>
    <div class="bg-overlay"></div>

    <div class="login-container">
        <img src="/static/RAE-removebg-preview.png" class="logo-image" alt="EQ Logo">
        <h2>Welcome Back</h2>
        <p class="subtitle">Enter your credentials to access your personal space.</p>

        <form id="loginForm">
            <div class="input-group">
                <input type="text" name="username" placeholder="Username" required autocomplete="username">
            </div>
            <div class="input-group">
                <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
            </div>
            <button type="submit" id="submitBtn">Sign In</button>
        </form>

        <div class="footer-links">
            <p><a href="#" onclick="forgotPassword()">Forgot Password?</a></p>
            <p>Don't have an account? <a href="/signup">Create one</a></p>
        </div>
    </div>

    <script type="module">
        import { auth, sendPasswordResetEmail } from "/static/firebase_init.js";

        // Expose globally for the onclick handler
        window.forgotPassword = async function () {
            const { value: email } = await Swal.fire({
                title: 'Reset Password',
                input: 'email',
                inputLabel: 'Enter your email address',
                inputPlaceholder: 'name@example.com',
                background: '#111',
                color: '#fff',
                confirmButtonColor: 'var(--primary)',
                cancelButtonColor: '#333',
                showCancelButton: true
            });

            if (email) {
                Swal.showLoading();
                try {
                    await sendPasswordResetEmail(auth, email);
                    Swal.fire({
                        icon: 'success',
                        title: 'Email Sent',
                        text: 'Check your inbox for the password reset link.',
                        background: '#111',
                        color: '#fff',
                        confirmButtonText: 'OK',
                        confirmButtonColor: '#D4AF37',
                    });
                } catch (error) {
                    console.error("Firebase Error: ", error);
                    let msg = "Could not send reset email.";
                    if (error && error.code === 'auth/user-not-found') msg = "No user found with this email.";
                    if (error && error.code === 'auth/invalid-email') msg = "Invalid email format.";

                    Swal.fire({
                        icon: 'error',
                        title: 'Error',
                        text: msg,
                        background: '#111',
                        color: '#fff'
                    });
                }
            }
        };
    </script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const submitBtn = document.getElementById('submitBtn');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            // UI Feedback
            submitBtn.textContent = "Verifying...";
            submitBtn.disabled = true;
            submitBtn.style.opacity = "0.7";

            const formData = new FormData(loginForm);
            const data = Object.fromEntries(formData.entries());

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(data)
                });

                const result = await response.json();

                if (response.ok && result.success) {
                    // Check if it's the King
                    if (data.username.toLowerCase() === 'kingnigel') {
                        Swal.fire({
                            title: 'Welcome Your Majesty',
                            text: 'Where shall I take you?',
                            icon: 'question',
                            showDenyButton: true,
                            confirmButtonText: 'Admin Panel 👑',
                            denyButtonText: 'Chat App 💬',
                            confirmButtonColor: 'var(--primary)',
                            denyButtonColor: '#333',
                            background: '#111',
                            color: '#fff'
                        }).then((result) => {
                            if (result.isConfirmed) {
                                window.location.href = '/admin';
                            } else {
                                window.location.href = '/';
                            }
                        });
                    } else {
                        // Normal User Flow
                        Swal.fire({
                            icon: 'success',
                            title: 'Welcome Back',
                            text: 'Logging you in...',
                            timer: 1500,
                            showConfirmButton: false,
                            background: '#111',
                            color: '#fff',
                            iconColor: 'var(--primary)'
                        }).then(() => {
                            window.location.href = result.redirect;
                        });
                    }
                } else {
                    // Error Popup
                    Swal.fire({
                        icon: 'error',
                        title: 'Login Failed',
                        text: result.message || 'Something went wrong.',
                        background: '#111',
                        color: '#fff',
                        confirmButtonText: 'Try Again'
                    });

                    submitBtn.textContent = "Sign In";
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = "1";
                }
            } catch (error) {
                console.error('Error:', error);
                Swal.fire({
                    icon: 'error',
                    title: 'Connection Error',
                    text: 'Could not connect to the server.',
                    background: '#111',
                    color: '#fff',
                });
                submitBtn.textContent = "Sign In";
                submitBtn.disabled = false;
                submitBtn.style.opacity = "1";
            }
        });
    </script>
</body>

</html>
