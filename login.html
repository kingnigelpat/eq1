<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EQ</title>
    <link rel="icon" href="/static/RAE-removebg-preview.png" type="image/png">
    <link rel="stylesheet" href="/static/eq_style.css">
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
            background: transparent;
            /* Animation is behind */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-content-container {
            background-color: rgba(17, 17, 17, 0.9);
            padding: 2rem;
            border-radius: 10px;
            width: 300px;
            text-align: center;
            border: 1px solid #333;
            position: relative;
            z-index: 1;
        }

        .avatar {
            width: 50px;
            height: 50px;
            background-color: #000;
            border: 2px solid #D4AF37;
            color: #D4AF37;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin: 0 auto 1rem;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #333;
            background-color: #222;
            color: #fff;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #D4AF37;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #D4AF37;
            color: #000000;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: bold;
        }

        button:hover {
            background-color: #AA8C2C;
        }

        a {
            color: #D4AF37;
            text-decoration: none;
            font-size: 0.8rem;
        }

        a:hover {
            text-decoration: underline;
        }

        .disclaimer {
            font-size: 0.75rem;
            color: #888;
            margin-top: 1.5rem;
            line-height: 1.4;
            border-top: 1px solid #333;
            padding-top: 1rem;
        }
    </style>
</head>

<body>
    <div class="bg-animation"></div>
    <div class="bg-overlay"></div>
    <div class="login-content-container">
        <div class="avatar">EQ</div>
        <h2>Welcome Back</h2>
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Username" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
        <p>Don't have an account? <a href="/signup">Sign Up</a></p>
        <p class="disclaimer">
            <strong>Privacy Notice:</strong> This is a real-time chat service.
            Conversations are temporary and not permanently stored.
        </p>
    </div>
</body>

</html>
