<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQ - Your Emotional Companion</title>
    <link rel="icon" href="/static/RAE-removebg-preview.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }

        .chat-container {
            width: 100%;
            height: 100vh;
            background-color: #000000;
            /* Seamless black */
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* Clean Header - Minimalist */
        .chat-header {
            background-color: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            color: #D4AF37;
            padding: 16px 24px;
            font-weight: 500;
            font-size: 1rem;
            display: flex;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            z-index: 10;
        }

        .chat-header .logo-text {
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .chat-messages {
            flex: 1;
            padding: 80px 20px 100px 20px;
            /* Top padding for header, bottom for input */
            overflow-y: auto;
            background-color: #000000;
            display: flex;
            flex-direction: column;
        }

        /* Welcome Screen - Centered & Large */
        .welcome-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            height: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        .welcome-title {
            font-size: 3rem;
            font-weight: 300;
            background: linear-gradient(135deg, #FFD700, #D4AF37, #AA8C2C);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
        }

        .welcome-subtitle {
            color: #666;
            font-size: 1.1rem;
            font-weight: 400;
            max-width: 400px;
            line-height: 1.5;
        }

        /* Messages */
        .message {
            margin-bottom: 24px;
            max-width: 80%;
            padding: 14px 20px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.5;
            position: relative;
            animation: slideUp 0.3s ease-out;
            white-space: pre-wrap;
        }

        .user-message {
            background-color: #D4AF37;
            color: #000000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.1);
        }

        .eq-message {
            background-color: #1a1a1a;
            color: #e0e0e0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        /* Input Area - Floating & Clean */
        .chat-input-area {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 800px;
            padding: 0;
            background: transparent;
            z-index: 10;
        }

        .input-wrapper {
            background-color: #1a1a1a;
            border-radius: 30px;
            padding: 8px 8px 8px 24px;
            display: flex;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            border: 1px solid #333;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #D4AF37;
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.1);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 1rem;
            padding-right: 12px;
        }

        .chat-input::placeholder {
            color: #666;
        }

        .send-button {
            width: 40px;
            height: 40px;
            background-color: #D4AF37;
            color: #000000;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s, background-color 0.2s;
        }

        .send-button:hover {
            background-color: #FFD700;
            transform: scale(1.05);
        }

        .send-button svg {
            width: 20px;
            height: 20px;
            fill: #000;
            margin-left: 2px;
            /* Visual correction */
        }

        /* Typing Indicator */
        .typing-indicator {
            display: flex;
            align-items: center;
            margin-bottom: 24px;
            margin-left: 10px;
            align-self: flex-start;
        }

        .typing-dot {
            width: 6px;
            height: 6px;
            background-color: #D4AF37;
            border-radius: 50%;
            margin: 0 3px;
            animation: typing 1.4s infinite ease-in-out;
            opacity: 0.7;
        }

        .typing-dot:nth-child(1) {
            animation-delay: 0s;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-4px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Scrollbar Styling */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background-color: #333;
            border-radius: 3px;
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="logo-text">EQ</div>
            <a href="/logout"
                style="margin-left: auto; color: rgba(255,255,255,0.6); text-decoration: none; font-size: 0.85rem; transition: color 0.2s;">Logout</a>
        </div>
        <div class="chat-messages" id="chatMessages">
            <div class="welcome-container" id="welcomeScreen">
                <div class="welcome-title">How do you feel, {{ username }}?</div>
                <div class="welcome-subtitle">I'm EQ, your emotional companion. Tell me about your day, or whatever is
                    on your mind.</div>
            </div>
        </div>
        <div class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" class="chat-input" placeholder="Message EQ..." autocomplete="off">
                <button class="send-button" id="sendButton">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = "https://eq1.up.railway.app";
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const welcomeScreen = document.getElementById('welcomeScreen');

        function removeWelcomeScreen() {
            if (welcomeScreen && welcomeScreen.parentNode) {
                welcomeScreen.parentNode.removeChild(welcomeScreen);
            }
        }

        function addUserMessage(text) {
            removeWelcomeScreen(); // Remove welcome screen on first user message
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addEQMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message eq-message';

            // Text only for cleaner look, or re-add avatar if preferred. Text only fits "modern" better.
            const textDiv = document.createElement('div');
            textDiv.textContent = text;
            messageDiv.appendChild(textDiv);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';

            // Simple dots without avatar for cleaner look
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                typingDiv.appendChild(dot);
            }

            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return typingDiv;
        }

        async function eqRespond(userMessage) {
            const typingIndicator = showTyping();

            try {
                // Get or create unique user ID for guests
                let userId = localStorage.getItem('eq_user_id');
                if (!userId) {
                    userId = 'guest_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('eq_user_id', userId);
                }
                const res = await fetch(`${API_BASE}/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: userMessage,
                        user_id: userId
                    })
                });
                const data = await res.json();

                chatMessages.removeChild(typingIndicator);
                addEQMessage(data.response);
            }

            catch (error) {
                if (typingIndicator.parentNode) chatMessages.removeChild(typingIndicator);
                addEQMessage("Sorry, I'm having trouble connecting to my brain right now. Is the python script running? 🧠");
                console.error('Error:', error);
            }
        }

        function handleSend() {
            const message = userInput.value.trim();

            if (message) {
                addUserMessage(message);
                userInput.value = '';
                eqRespond(message);
            }
        }

        sendButton.addEventListener('click', handleSend);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSend();
            }
        });

        // Focus input on load
        userInput.focus();
    </script>
</body>

</html>
