<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQ - Your Emotional Companion</title>
    <link rel="icon" href="/static/RAE-removebg-preview.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #D4AF37;
            --primary-glow: rgba(212, 175, 55, 0.1);
            --bg-black: #000000;
            --bg-dark: #111111;
            --bg-accent: #1a1a1a;
            --text-white: #ffffff;
            --text-gray: #e0e0e0;
            --text-muted: #666666;
            --header-height: 60px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            /* Prevent body scrolling */
            background-color: var(--bg-black);
            color: var(--text-white);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-black);
            max-width: 800px;
            /* Optional: limit width on desktop while staying fit */
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Responsive max-width reset */
        @media (max-width: 800px) {
            .chat-container {
                max-width: 100%;
                border: none;
            }
        }

        .chat-header {
            flex-shrink: 0;
            height: var(--header-height);
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--primary);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-text {
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }

        .logout-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: var(--primary);
        }

        .chat-messages {
            flex: 1;
            padding: 20px 15px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-accent) transparent;
            -webkit-overflow-scrolling: touch;
            /* Smooth mobile scroll */
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--bg-accent);
            border-radius: 10px;
        }

        .welcome-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.6s ease-out;
            height: 100%;
        }

        .welcome-title {
            font-size: clamp(1.6rem, 8vw, 2.4rem);
            font-weight: 300;
            background: linear-gradient(135deg, #FFD700, #D4AF37, #AA8C2C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            color: var(--text-muted);
            font-size: clamp(0.85rem, 4vw, 1rem);
            max-width: 400px;
            line-height: 1.5;
        }

        .message {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: slideUp 0.3s ease-out;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--primary);
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .eq-message {
            background-color: var(--bg-accent);
            color: var(--text-gray);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .chat-input-area {
            flex-shrink: 0;
            padding: 15px;
            background-color: var(--bg-black);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-wrapper {
            width: 100%;
            background-color: var(--bg-accent);
            border-radius: 24px;
            padding: 4px 4px 4px 18px;
            display: flex;
            align-items: center;
            border: 1px solid #333;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 0.95rem;
            padding: 10px 0;
        }

        .send-button {
            width: 38px;
            height: 38px;
            background-color: var(--primary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-left: 8px;
            flex-shrink: 0;
        }

        .send-button:hover {
            background-color: #FFD700;
        }

        .send-button svg {
            width: 18px;
            height: 18px;
            fill: #000;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 16px;
            background-color: var(--bg-accent);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .typing-dot {
            width: 5px;
            height: 5px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
            opacity: 0.5;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-4px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile specific fixes */
        @media (max-width: 480px) {
            .chat-messages {
                padding: 15px 10px;
            }

            .message {
                max-width: 90%;
                font-size: 0.9rem;
            }

            .chat-input-area {
                padding: 10px;
            }

            .welcome-title {
                font-size: 1.8rem;
            }
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="logo-text">EQ</div>
            <a href="/logout" class="logout-link">Logout</a>
        </header>

        <main class="chat-messages" id="chatMessages">
            <div class="welcome-container" id="welcomeScreen">
                <div class="welcome-title">How do you feel, {{ username }}?</div>
                <div class="welcome-subtitle">I'm EQ, your emotional companion. Tell me about your day, or whatever is
                    on your mind.</div>
            </div>
        </main>

        <section class="chat-input-area">
            <div class="input-wrapper">
                <input type="text" id="userInput" class="chat-input" placeholder="Message EQ..." autocomplete="off">
                <button class="send-button" id="sendButton">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
        </section>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const welcomeScreen = document.getElementById('welcomeScreen');

        function removeWelcomeScreen() {
            if (welcomeScreen && welcomeScreen.parentNode) {
                welcomeScreen.parentNode.removeChild(welcomeScreen);
            }
        }

        function addUserMessage(text) {
            removeWelcomeScreen(); // Remove welcome screen on first user message
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addEQMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message eq-message';

            // Text only for cleaner look, or re-add avatar if preferred. Text only fits "modern" better.
            const textDiv = document.createElement('div');
            textDiv.textContent = text;
            messageDiv.appendChild(textDiv);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';

            // Simple dots without avatar for cleaner look
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                typingDiv.appendChild(dot);
            }

            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return typingDiv;
        }

        async function eqRespond(userMessage) {
            const typingIndicator = showTyping();

            try {
                // Get or create unique user ID for guests
                let userId = localStorage.getItem('eq_user_id');
                if (!userId) {
                    userId = 'guest_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('eq_user_id', userId);
                }
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        message: userMessage,
                        user_id: userId
                    })
                });
                const data = await res.json();

                chatMessages.removeChild(typingIndicator);
                addEQMessage(data.response);
            }

            catch (error) {
                if (typingIndicator.parentNode) chatMessages.removeChild(typingIndicator);
                addEQMessage("Sorry, I'm having trouble connecting to my brain right now. Is the python script running? 🧠");
                console.error('Error:', error);
            }
        }

        function handleSend() {
            const message = userInput.value.trim();

            if (message) {
                addUserMessage(message);
                userInput.value = '';
                eqRespond(message);
            }
        }

        sendButton.addEventListener('click', handleSend);

        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSend();
            }
        });

        // Focus input on load
        userInput.focus();
    </script>
</body>

</html>
