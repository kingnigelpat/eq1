<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EQ - Your Emotional Companion</title>
    <link rel="icon" href="/static/RAE-removebg-preview.png" type="image/png">
    <link rel="stylesheet" href="/static/eq_style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>

<body>
    <div class="bg-animation"></div>
    <div class="bg-overlay"></div>
    <div class="chat-container">
        <header class="chat-header">
            <span class="logo-text">EQ</span>
            <div style="display:flex; gap:15px; align-items:center;">

                <a href="/logout" class="logout-link" onclick="localStorage.removeItem('eq_user_id');">Logout</a>
            </div>
        </header>

        <div class="chat-messages" id="chat-messages">
            <div class="welcome-container" id="welcomeScreen">
                <div class="welcome-title">Hello, {{ username }}</div>
                <div class="welcome-subtitle">I'm EQ. How are you feeling today?</div>
                <button class="main-call-btn" onclick="startVoiceCall()">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z" />
                    </svg>
                    Start Voice Chat
                </button>
            </div>
        </div>

        <div class="file-indicator" id="fileIndicator">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"></path>
                <polyline points="13 2 13 9 20 9"></polyline>
            </svg>
            <span id="fileName"></span>
            <button onclick="clearFile()"
                style="background:none;border:none;color:inherit;cursor:pointer;">&times;</button>
        </div>

        <div class="chat-input-area">
            <div class="input-wrapper">
                <button class="action-button" id="uploadBtn" title="Upload File">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48" />
                    </svg>
                </button>
                <input type="file" id="fileInput" hidden>

                <input type="text" class="chat-input" id="userInput" placeholder="Type a message..." autocomplete="off">

                <button class="action-button" id="micBtn" title="Voice Input">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                        <path
                            d="M17 11c0 3.01-2.44 5.5-5.5 5.5S6 14.01 6 11H4c0 3.53 2.61 6.43 6 6.92V21h4v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                    </svg>
                </button>

                <button class="send-button" id="sendButton">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
                    </svg>
                </button>
            </div>
            <!-- Removed Voice Call Wrapper from here -->
        </div>
    </div>

    <!-- Voice Overlay -->
    <button id="fabCallBtn" class="fab-call-btn" title="Start Voice Call" onclick="startVoiceCall()">
        <svg viewBox="0 0 24 24">
            <path
                d="M20 15.5c-1.25 0-2.45-.2-3.57-.57-.35-.11-.74-.03-1.02.24l-2.2 2.2c-2.83-1.44-5.15-3.75-6.59-6.59l2.2-2.21c.28-.26.36-.65.25-1C8.7 6.45 8.5 5.25 8.5 4c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1 0 9.39 7.61 17 17 17 .55 0 1-.45 1-1v-3.5c0-.55-.45-1-1-1z" />
        </svg>
    </button>

    <!-- Voice Overlay -->
    <div class="voice-overlay" id="voiceOverlay">
        <button class="voice-settings-btn" onclick="toggleVoiceSettings()">⚙️</button>

        <div class="voice-settings-panel" id="voiceSettingsPanel">
            <div class="settings-row">
                <span class="settings-label">Voice</span>
                <select id="voiceSelect"></select>
            </div>
            <div class="settings-row">
                <span class="settings-label">Speed: <span id="rateValue">1.0</span></span>
                <input type="range" id="rateRange" min="0.5" max="2" step="0.1" value="1">
            </div>
            <div class="settings-row">
                <span class="settings-label">Pitch: <span id="pitchValue">1.0</span></span>
                <input type="range" id="pitchRange" min="0.5" max="2" step="0.1" value="1">
            </div>
            <button class="test-voice-btn" onclick="testVoice()">Test Voice</button>
        </div>

        <div class="voice-status" id="voiceStatus">Listening...</div>

        <div class="voice-visualizer" id="voiceVisualizer" onclick="activateVoiceOnMobile()" style="cursor: pointer;">
            <svg viewBox="0 0 24 24">
                <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
            </svg>
            <div class="waveform-container">
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
                <div class="waveform-bar"></div>
            </div>
        </div>

        <div id="voiceTranscript"
            style="max-width:80%; text-align:center; margin-bottom:30px; min-height:24px; color:rgba(255,255,255,0.7);">
        </div>

        <button class="action-button" id="voiceSendBtn"
            style="width:60px; height:60px; background:var(--primary); margin-bottom:30px; display:none;">
            <svg viewBox="0 0 24 24" style="width:30px; height:30px; fill:#000;">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
            </svg>
        </button>

        <button class="close-voice-btn" onclick="endVoiceCall()">End Call</button>
    </div>

    <script>
        // --- Global State ---
        let currentFileContent = "";
        let currentFileName = "";
        let isVoiceMode = false;
        let isVoiceCallActive = false;
        let voiceCallUtterance = null;
        let voices = [];
        let recognition = null;
        let currentAudio = null;
        let silenceTimer = null; // Timer for auto-send
        let typingInterval = null; // Timer for text typing effect
        let isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

        // --- Elements ---
        const chatMessages = document.getElementById('chat-messages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const micBtn = document.getElementById('micBtn');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const fileIndicator = document.getElementById('fileIndicator');
        const fileNameSpan = document.getElementById('fileName');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const voiceSelect = document.getElementById('voiceSelect');
        const rateRange = document.getElementById('rateRange');
        const pitchRange = document.getElementById('pitchRange');
        const voiceSettingsPanel = document.getElementById('voiceSettingsPanel');
        const rateValueDisplay = document.getElementById('rateValue');
        const pitchValueDisplay = document.getElementById('pitchValue');
        // const voiceCallBtn = document.getElementById('voiceCallBtn');
        const voiceOverlay = document.getElementById('voiceOverlay');
        const voiceStatus = document.getElementById('voiceStatus');
        const voiceVisualizer = document.getElementById('voiceVisualizer');
        const voiceTranscript = document.getElementById('voiceTranscript');
        const voiceSendBtn = document.getElementById('voiceSendBtn');

        // --- Voice Logic ---
        const voiceOptions = [
            { name: "EQ (Male)", id: "male-premium", type: "premium" },
            { name: "EQ (Female)", id: "female-premium", type: "premium" },
            { name: "EQ (Pidgin)", id: "pidgin-premium", type: "premium" }
        ];

        function populateVoiceList() {
            voiceSelect.innerHTML = '';
            voiceOptions.forEach(v => {
                const option = document.createElement('option');
                option.textContent = v.name;
                option.setAttribute('data-id', v.id);
                option.setAttribute('data-type', v.type);
                voiceSelect.appendChild(option);
            });

            // Restore selection
            const savedId = localStorage.getItem('eq_selected_voice_id');
            if (savedId) {
                const option = Array.from(voiceSelect.options).find(o => o.getAttribute('data-id') === savedId);
                if (option) option.selected = true;
            } else {
                voiceSelect.selectedIndex = 0;
            }

            updateVoiceControls();
        }

        function updateVoiceControls() {
            const selectedOption = voiceSelect.selectedOptions[0];
            const type = selectedOption ? selectedOption.getAttribute('data-type') : 'premium';

            // Hide Pitch control for Premium voices (not supported by HTML5 Audio)
            if (type === 'premium') {
                pitchRange.parentElement.style.display = 'none';
            } else {
                pitchRange.parentElement.style.display = 'block';
            }
        }

        voiceSelect.addEventListener('change', () => {
            const selectedOption = voiceSelect.selectedOptions[0];
            const type = selectedOption.getAttribute('data-type');
            const id = type === 'premium' ? selectedOption.getAttribute('data-id') : selectedOption.getAttribute('data-name');
            localStorage.setItem('eq_selected_voice_id', id);
            updateVoiceControls();
        });

        rateRange.addEventListener('input', () => { rateValueDisplay.innerText = rateRange.value; });
        pitchRange.addEventListener('input', () => { pitchValueDisplay.innerText = pitchRange.value; });

        function toggleVoiceSettings() {
            voiceSettingsPanel.classList.toggle('active');
            if (voiceSettingsPanel.classList.contains('active')) {
                voiceSettingsPanel.style.display = 'flex';
            } else {
                voiceSettingsPanel.style.display = 'none';
            }
        }

        window.testVoice = function () {
            speak("This is how I sound.", null, true);
        };

        window.activateVoiceOnMobile = function () {
            if (!isVoiceCallActive) return;
            const status = voiceStatus.innerText;
            if (status !== "Listening..." && status !== "Thinking..." && !status.includes("Speaking")) {
                try { recognition.stop(); } catch (e) { }
                window.speechSynthesis.cancel();
                startListening();
            }
        };

        function startListening() {
            if (!recognition) return;
            try {
                if (window.speechSynthesis) {
                    window.speechSynthesis.pause();
                    window.speechSynthesis.resume();
                }
                recognition.start();
                voiceStatus.innerText = "Listening...";
                voiceVisualizer.style.opacity = '1';
                voiceSendBtn.style.display = 'flex';
                voiceVisualizer.classList.remove('speaking');
            } catch (e) {
                console.log("Recognition start error:", e);
            }
        }

        function speak(text, onEndCallback, isTest) {
            if (currentAudio) { currentAudio.pause(); currentAudio = null; }
            if (window.speechSynthesis) window.speechSynthesis.cancel();

            // Visualizer Reset
            voiceVisualizer.classList.remove('speaking');

            // Regex to remove emojis (most common ranges)
            const noEmojiText = text.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F780}-\u{1F7FF}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}]/gu, '');

            const textToSpeak = noEmojiText.replace(/[*#`_]/g, '')
                .replace(/!\[.*?\]\(.*?\)/g, ' I have generated an image. ')
                .replace(/\[DOWNLOAD:.*?\]/g, ' File ready. ');

            const selectedOption = voiceSelect.selectedOptions[0];
            const type = selectedOption ? selectedOption.getAttribute('data-type') : 'premium';
            const voiceId = selectedOption ? selectedOption.getAttribute('data-id') : 'male-premium';

            if (type === 'premium') {
                // Server-Side Edge TTS
                if (isVoiceCallActive || isTest) {
                    if (!isTest) voiceStatus.innerText = "Generating Voice...";
                    // Animation deferred until playback starts
                    if (!isTest) {
                        // Show what AI is saying in the transcript area
                        // voiceTranscript.innerText = text; // Disabled for typing effect
                        voiceTranscript.innerText = "";
                        voiceSendBtn.style.display = 'none';
                    }
                }

                fetch('/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textToSpeak, voice: voiceId })
                })

                    .then(response => {
                        if (!response.ok) throw new Error('TTS Failed');
                        return response.blob();
                    })
                    .then(blob => {
                        const audioUrl = URL.createObjectURL(blob);
                        currentAudio = new Audio(audioUrl);
                        currentAudio.playbackRate = parseFloat(rateRange.value) || 1.0;

                        currentAudio.onplay = () => {
                            if (isVoiceCallActive || isTest) {
                                voiceVisualizer.classList.add('speaking');
                                if (!isTest) {
                                    voiceStatus.innerText = "EQ Speaking...";
                                    // Start synced typing
                                    const duration = currentAudio.duration && isFinite(currentAudio.duration) ? currentAudio.duration : (text.length * 0.06);
                                    startTypingEffect(text, duration);
                                }
                            }
                        };

                        currentAudio.onended = () => {
                            voiceVisualizer.classList.remove('speaking');
                            if (isVoiceCallActive && !isTest) {
                                voiceStatus.innerText = "Tap circle to speak"; // Reset status
                            }
                            if (onEndCallback) onEndCallback();
                        };

                        currentAudio.play();
                    })
                    .catch(err => {
                        console.error("Premium Voice Failed, falling back to system:", err);
                        speakSystem(textToSpeak, onEndCallback, isTest);
                    });
            } else {
                speakSystem(textToSpeak, onEndCallback, isTest);
            }
        }

        function speakSystem(text, onEndCallback, isTest) {
            if (!window.speechSynthesis) {
                if (onEndCallback) onEndCallback();
                return;
            }
            if (voices.length === 0) voices = window.speechSynthesis.getVoices();

            const utterance = new SpeechSynthesisUtterance(text);
            voiceCallUtterance = utterance;

            const selectedOption = voiceSelect.selectedOptions[0];
            const gender = selectedOption ? selectedOption.getAttribute('data-id') : 'male';

            let targetVoice = null;
            if (gender === 'female') {
                targetVoice = voices.find(v => v.name.includes('Zira') || v.name.includes('Google US English') || v.name.includes('Samantha') || v.name.includes('Female'));
            } else {
                // Prioritize David (Windows) or Alex (Apple US)
                targetVoice = voices.find(v => v.name.includes('David') || v.name.includes('Alex'));

                // Fallback to Daniel (British) or generic Male
                if (!targetVoice) targetVoice = voices.find(v => v.name.includes('Daniel') || v.name.includes('Male'));
            }

            if (targetVoice) utterance.voice = targetVoice;
            else utterance.voice = voices.find(v => v.lang.startsWith('en')) || voices[0];

            utterance.rate = parseFloat(rateRange.value);
            utterance.pitch = parseFloat(pitchRange.value);

            utterance.onstart = () => {
                if (isVoiceCallActive || isTest) {
                    if (!isTest) voiceStatus.innerText = "EQ Speaking...";
                    voiceVisualizer.classList.add('speaking');
                    if (!isTest) {
                        voiceTranscript.innerText = text;  // Show text on screen
                        voiceSendBtn.style.display = 'none';
                    }
                }
            };

            utterance.onend = () => {
                if (isVoiceCallActive || isTest) {
                    voiceVisualizer.classList.remove('speaking');
                    if (onEndCallback) onEndCallback();
                }
            };

            utterance.onerror = (e) => {
                if (isVoiceCallActive) {
                    voiceVisualizer.classList.remove('speaking');
                    if (onEndCallback) onEndCallback();
                }
            };

            window.speechSynthesis.speak(utterance);
        }

        // --- Recognition Setup ---
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                if (isVoiceCallActive) {
                    voiceStatus.innerText = "Listening...";
                    voiceTranscript.innerText = "";
                    voiceSendBtn.style.display = 'flex';
                    voiceSendBtn.style.opacity = '1';
                } else {
                    micBtn.classList.add('recording');
                    userInput.placeholder = "Listening... (Click mic to stop)";
                }
            };

            recognition.onerror = (event) => {
                if (isVoiceCallActive) {
                    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
                        voiceStatus.innerText = "Microphone Access Denied";
                        alert("Please allow microphone access.");
                    } else {
                        voiceStatus.innerText = "Tap circle to speak";
                        voiceVisualizer.style.opacity = '0.5';
                    }
                }
            };

            recognition.onend = () => {
                micBtn.classList.remove('recording');
                userInput.placeholder = "Message EQ...";
                if (isVoiceCallActive && !window.blockRestart) {
                    if (isMobile) {
                        voiceStatus.innerText = "Tap circle to speak";
                        voiceVisualizer.style.opacity = '0.5';
                    } else {
                        setTimeout(() => {
                            if (isVoiceCallActive && !window.speechSynthesis.speaking) {
                                try { recognition.start(); } catch (e) {
                                    voiceStatus.innerText = "Tap circle to speak";
                                    voiceVisualizer.style.opacity = '0.5';
                                }
                            }
                        }, 300);
                    }
                }
            };

            recognition.onresult = (event) => {
                let fullTranscript = '';
                for (let i = 0; i < event.results.length; i++) {
                    fullTranscript += event.results[i][0].transcript;
                }

                if (isVoiceCallActive) {
                    voiceTranscript.innerText = fullTranscript;
                    userInput.value = fullTranscript;

                    // Auto-Send on Silence (increased to 6s to prevent premature sending)
                    clearTimeout(silenceTimer);
                    if (fullTranscript.trim().length > 0) {
                        silenceTimer = setTimeout(() => {
                            // Trigger Send Logic
                            window.blockRestart = true;
                            recognition.stop();
                            voiceStatus.innerText = "Thinking...";
                            handleSend();
                        }, 6000);
                    }
                } else {
                    userInput.value = fullTranscript;
                }
            };

            micBtn.addEventListener('click', () => {
                if (isVoiceCallActive) return;
                if (micBtn.classList.contains('recording')) {
                    recognition.stop();
                } else {
                    recognition.start();
                    userInput.value = '';
                }
            });

            // voiceCallBtn.addEventListener('click', startVoiceCall);

            // Expose globally for the main button
            window.startVoiceCall = startVoiceCall;

            function startVoiceCall() {
                isVoiceCallActive = true;
                window.blockRestart = false;
                voiceOverlay.classList.add('active');

                // Hide FAB when call starts
                const fab = document.getElementById('fabCallBtn');
                if (fab) fab.classList.remove('visible');

                // iOS Wakeup
                if (window.speechSynthesis) {
                    const dummy = new SpeechSynthesisUtterance('');
                    dummy.volume = 0;
                    window.speechSynthesis.speak(dummy);
                    window.speechSynthesis.cancel();
                }

                if (recognition && recognition.abort) recognition.abort();
                setTimeout(() => {
                    userInput.value = '';
                    startListening();
                }, 500);
            }

            voiceSendBtn.addEventListener('click', () => {
                if (!isVoiceCallActive) return;
                const text = userInput.value.trim();
                if (!text) return;
                window.blockRestart = true;
                recognition.stop();
                voiceStatus.innerText = "Thinking...";
                handleSend();
            });

            window.endVoiceCall = function () {
                isVoiceCallActive = false;
                window.blockRestart = true;
                clearTimeout(silenceTimer); // Clear timer
                clearInterval(typingInterval); // Clear typing effect
                voiceOverlay.classList.remove('active');

                // Show FAB when call ends
                const fab = document.getElementById('fabCallBtn');
                if (fab) fab.classList.add('visible');
                if (recognition) recognition.abort();
                window.speechSynthesis.cancel();
            };

        } else {
            micBtn.style.display = 'none';
        }

        // --- Chat Logic ---
        function removeWelcomeScreen() {
            if (welcomeScreen && welcomeScreen.parentNode) {
                welcomeScreen.parentNode.removeChild(welcomeScreen);
            }
        }

        function parseMarkdown(text) {
            let html = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
            html = html.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');
            html = html.replace(/\[DOWNLOAD:\s*([^\]]+)\]/g, (match, filename) => {
                return `<button onclick="downloadCode(this, '${filename.trim()}')" style="margin-top:8px;padding:6px 12px;background:var(--primary);border:none;border-radius:4px;cursor:pointer;color:#000;font-weight:500;">Download ${filename.trim()}</button>`;
            });
            return html;
        }

        window.downloadCode = function (btn, filename) {
            const messageDiv = btn.closest('.message');
            let pre = null;
            const pres = messageDiv.querySelectorAll('pre');
            if (pres.length > 0) pre = pres[pres.length - 1];

            if (!pre) { alert("Could not find content"); return; }
            const content = pre.textContent;

            if (filename.toLowerCase().endsWith('.pdf')) {
                if (!window.jspdf) { alert("Loading PDF engine..."); return; }
                try {
                    const { jsPDF } = window.jspdf;
                    const doc = new jsPDF();

                    doc.setFont("helvetica", "normal");
                    doc.setFontSize(12);

                    const pageWidth = doc.internal.pageSize.getWidth();
                    const pageHeight = doc.internal.pageSize.getHeight();
                    const margin = 20;
                    const maxLineWidth = pageWidth - (margin * 2);

                    const splitText = doc.splitTextToSize(content, maxLineWidth);

                    let y = 20;
                    const lineHeight = 7;

                    for (let i = 0; i < splitText.length; i++) {
                        if (y + lineHeight > pageHeight - margin) {
                            doc.addPage();
                            y = 20;
                        }
                        doc.text(splitText[i], margin, y);
                        y += lineHeight;
                    }

                    doc.save(filename);
                } catch (e) { alert("Error: " + e.message); }
            } else {
                const blob = new Blob([content], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url; a.download = filename; a.click();
            }
        };

        function addUserMessage(text) {
            removeWelcomeScreen();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';
            if (currentFileName) text += `\n[Attached: ${currentFileName}]`;
            messageDiv.innerText = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addEQMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message eq-message';
            messageDiv.innerHTML = parseMarkdown(text);
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                typingDiv.appendChild(dot);
            }
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return typingDiv;
        }

        async function eqRespond(userMessage) {
            const typingIndicator = showTyping();
            let prompt = userMessage;
            if (currentFileContent) {
                prompt += `\n\n[USER UPLOADED FILE CONTENT (${currentFileName})]:\n${currentFileContent}`;
                clearFile();
            }

            try {
                let userId = localStorage.getItem('eq_user_id');
                if (!userId) {
                    userId = 'guest_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('eq_user_id', userId);
                }
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: prompt, user_id: userId })
                });

                if (!res.ok) {
                    throw new Error(`HTTP error! status: ${res.status}`);
                }

                const data = await res.json();

                if (typingIndicator.parentNode) chatMessages.removeChild(typingIndicator);
                if (data.alert) alert(data.alert);

                addEQMessage(data.response);

                if (isVoiceMode || isVoiceCallActive) {
                    speak(data.response, () => {
                        if (isVoiceCallActive) {
                            window.blockRestart = false;
                            if (!isMobile) {
                                try { startListening(); } catch (e) { }
                            } else {
                                voiceStatus.innerText = "Tap circle to speak";
                                voiceVisualizer.style.opacity = '0.5';
                            }
                        }
                    });
                }
            } catch (error) {
                if (typingIndicator.parentNode) chatMessages.removeChild(typingIndicator);
                console.error("Chat Error:", error);
                addEQMessage("Hey — I'm having trouble connecting to the cloud right now ☁️ (" + error.message + ")");
            }
        }

        function handleSend() {
            const message = userInput.value.trim();
            if (message || currentFileContent) {
                addUserMessage(message || "(File Upload)");
                userInput.value = '';
                eqRespond(message || "Analyze this file.");
            }
        }

        sendButton.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                isVoiceMode = false;
                handleSend();
            }
        });

        // --- File Upload ---
        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);
            const userId = localStorage.getItem('eq_user_id');
            if (userId) formData.append('user_id', userId);

            try {
                uploadBtn.style.opacity = '0.5';
                const res = await fetch('/upload', { method: 'POST', body: formData });
                const data = await res.json();

                if (data.error) {
                    alert('Upload failed: ' + data.error);
                } else {
                    if (data.full_content && data.full_content.length < 50000) {
                        currentFileContent = data.full_content;
                    } else {
                        currentFileContent = data.content;
                    }
                    currentFileName = data.filename;
                    fileIndicator.classList.add('active');
                    fileNameSpan.textContent = data.filename;
                }
            } catch (err) {
                console.error(err);
                alert('Upload failed');
            } finally {
                uploadBtn.style.opacity = '1';
                fileInput.value = '';
            }
        });

        window.clearFile = function () {
            currentFileContent = "";
            currentFileName = "";
            fileIndicator.classList.remove('active');
        };

        // --- Init ---
        window.addEventListener('load', () => {
            populateVoiceList();
            // Show FAB on load
            const fab = document.getElementById('fabCallBtn');
            if (fab) setTimeout(() => fab.classList.add('visible'), 1000);
        });
        // Fallback safety
        setTimeout(populateVoiceList, 1000);

        function startTypingEffect(text, durationSeconds) {
            if (!voiceTranscript) return;
            voiceTranscript.innerText = "";
            clearInterval(typingInterval);

            // Calculate delay per char
            // Ensure reasonable minimum duration logic
            const safeDuration = durationSeconds > 0 ? durationSeconds : 3;
            const totalTime = safeDuration * 1000;
            const charDelay = totalTime / text.length;

            let i = 0;
            typingInterval = setInterval(() => {
                if (i < text.length) {
                    voiceTranscript.textContent += text.charAt(i);
                    i++;
                    voiceTranscript.scrollTop = voiceTranscript.scrollHeight;
                } else {
                    clearInterval(typingInterval);
                }
            }, charDelay);
        }

    </script>
</body>

</html>
