<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQ - Your Emotional Companion</title>
    <link rel="icon" href="/static/RAE-removebg-preview.png" type="image/png">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #D4AF37;
            --primary-glow: rgba(212, 175, 55, 0.1);
            --bg-black: #000000;
            --bg-dark: #111111;
            --bg-accent: #1a1a1a;
            --text-white: #ffffff;
            --text-gray: #e0e0e0;
            --text-muted: #666666;
            --header-height: 60px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-black);
            color: var(--text-white);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-black);
            max-width: 800px;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 800px) {
            .chat-container {
                max-width: 100%;
                border: none;
            }
        }

        .chat-header {
            flex-shrink: 0;
            height: var(--header-height);
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--primary);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-text {
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }

        .logout-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: var(--primary);
        }

        .chat-messages {
            flex: 1;
            padding: 20px 15px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-accent) transparent;
            -webkit-overflow-scrolling: touch;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--bg-accent);
            border-radius: 10px;
        }

        .welcome-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.6s ease-out;
            height: 100%;
        }

        .welcome-title {
            font-size: clamp(1.6rem, 8vw, 2.4rem);
            font-weight: 300;
            background: linear-gradient(135deg, #FFD700, #D4AF37, #AA8C2C);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            color: var(--text-muted);
            font-size: clamp(0.85rem, 4vw, 1rem);
            max-width: 400px;
            line-height: 1.5;
        }

        .message {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: slideUp 0.3s ease-out;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--primary);
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .eq-message {
            background-color: var(--bg-accent);
            color: var(--text-gray);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Image Styling in Chat */
        .eq-message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        .eq-message code {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .message pre {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .chat-input-area {
            flex-shrink: 0;
            padding: 15px;
            background-color: var(--bg-black);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-wrapper {
            width: 100%;
            background-color: var(--bg-accent);
            border-radius: 24px;
            padding: 4px 4px 4px 12px;
            display: flex;
            align-items: center;
            border: 1px solid #333;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 0.95rem;
            padding: 10px 8px;
        }

        .action-button {
            width: 38px;
            height: 38px;
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .action-button:hover {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .send-button {
            width: 38px;
            height: 38px;
            background-color: var(--primary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-left: 4px;
            flex-shrink: 0;
        }

        .send-button:hover {
            background-color: #FFD700;
        }

        .send-button svg {
            width: 18px;
            height: 18px;
            fill: #000;
        }

        .action-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .recording {
            color: #ff4444 !important;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(255, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 68, 68, 0);
            }
        }

        .file-indicator {
            display: none;
            padding: 4px 12px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 12px;
            color: var(--primary);
            font-size: 0.75rem;
            margin-bottom: 8px;
            align-items: center;
            gap: 6px;
        }

        .file-indicator.active {
            display: flex;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 16px;
            background-color: var(--bg-accent);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .typing-dot {
            width: 5px;
            height: 5px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
            opacity: 0.5;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-4px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .chat-inputs-row {
                gap: 4px;
            }

            .message {
                max-width: 90%;
                font-size: 0.9rem;
            }

            .input-wrapper {
                padding-left: 8px;
            }
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="logo-text">EQ</div>
            <a href="/logout" class="logout-link">Logout</a>
        </header>

        <main class="chat-messages" id="chatMessages">
            <div class="welcome-container" id="welcomeScreen">
                <div class="welcome-title">How do you feel today?</div>
                <div class="welcome-subtitle">I'm EQ, your emotional companion. Share your thoughts, upload a file, or
                    create something new.</div>
            </div>
        </main>

        <section class="chat-input-area">
            <div id="fileIndicator" class="file-indicator">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
                </svg>
                <span id="fileName">File attached</span>
                <span style="cursor:pointer" onclick="clearFile()">×</span>
            </div>

            <div class="input-wrapper">
                <input type="file" id="fileInput" hidden>

                <button class="action-button" id="uploadBtn" title="Upload File">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5a2.5 2.5 0 0 1 5 0v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5a2.5 2.5 0 0 0 5 0V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.04 2.46 5.5 5.5 5.5s5.5-2.46 5.5-5.5V6h-1.5z" />
                    </svg>
                </button>

                <button class="action-button" id="micBtn" title="Voice Chat">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                        <path
                            d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" />
                    </svg>
                </button>

                <input type="text" id="userInput" class="chat-input" placeholder="Message EQ..." autocomplete="off">

                <button class="send-button" id="sendButton">
                    <svg viewBox="0 0 24 24">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>
        </section>
    </div>

    <script>
        const chatMessages = document.getElementById('chatMessages');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');
        const welcomeScreen = document.getElementById('welcomeScreen');
        const fileInput = document.getElementById('fileInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const micBtn = document.getElementById('micBtn');
        const fileIndicator = document.getElementById('fileIndicator');
        const fileNameSpan = document.getElementById('fileName');

        let currentFileContent = "";
        let currentFileName = "";

        // --- File Upload ---
        uploadBtn.addEventListener('click', () => fileInput.click());

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const formData = new FormData();
            formData.append('file', file);

            try {
                // Show uploading state
                uploadBtn.style.opacity = '0.5';

                const res = await fetch('/upload', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();

                if (data.error) {
                    alert('Upload failed: ' + data.error);
                } else {
                    currentFileContent = data.content; // Use data.full_content if preferred, but safer to preview
                    // If full content is needed for AI, we'd prefer sending full_content to DB. 
                    // But here we attach to message. Using 'content' (preview) + '...' might be safer for massive files.
                    // Let's use full_content if reasonable size, else preview.
                    if (data.full_content && data.full_content.length < 50000) {
                        currentFileContent = data.full_content;
                    }
                    currentFileName = data.filename;

                    fileIndicator.classList.add('active');
                    fileNameSpan.textContent = data.filename;
                }
            } catch (err) {
                console.error(err);
                alert('Upload failed');
            } finally {
                uploadBtn.style.opacity = '1';
                fileInput.value = ''; // Reset so same file can be selected again
            }
        });

        window.clearFile = function () {
            currentFileContent = "";
            currentFileName = "";
            fileIndicator.classList.remove('active');
        };

        // --- Voice Chat (Web Speech API) ---
        let recognition;
        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            recognition = new SpeechRecognition();
            recognition.continuous = false;
            recognition.interimResults = false;
            recognition.lang = 'en-US';

            recognition.onstart = () => {
                micBtn.classList.add('recording');
                userInput.placeholder = "Listening...";
            };

            recognition.onend = () => {
                micBtn.classList.remove('recording');
                userInput.placeholder = "Message EQ...";
            };

            recognition.onresult = (event) => {
                const transcript = event.results[0][0].transcript;
                userInput.value = transcript;
                // Optional: Auto-send
                // handleSend();
            };

            micBtn.addEventListener('click', () => {
                if (micBtn.classList.contains('recording')) {
                    recognition.stop();
                } else {
                    recognition.start();
                }
            });
        } else {
            micBtn.style.display = 'none'; // Not supported
        }

        // --- UI Logic ---

        function removeWelcomeScreen() {
            if (welcomeScreen && welcomeScreen.parentNode) {
                welcomeScreen.parentNode.removeChild(welcomeScreen);
            }
        }

        function parseMarkdown(text) {
            // 1. Images: ![alt](url)
            let html = text.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1">');

            // 2. Bold: **text**
            html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');

            // 3. Code Blocks: ```code```
            // Simple handling: wrap in <pre>
            html = html.replace(/```([\s\S]*?)```/g, '<pre>$1</pre>');

            // 4. Download Link: [DOWNLOAD: filename]
            // We turn this into a button that downloads the preceding code context? 
            // Or simpler: just a download link if we can't easily grab context.
            // Let's make it a clickable dummy link or button
            html = html.replace(/\[DOWNLOAD:\s*([^\]]+)\]/g, (match, filename) => {
                return `<button onclick="downloadLastCodeBlock('${filename.trim()}')" style="margin-top:8px;padding:6px 12px;background:var(--primary);border:none;border-radius:4px;cursor:pointer;">Download ${filename.trim()}</button>`;
            });

            return html;
        }

        // Helper to download the content of the last code block found in the message DIV
        // This is a bit hacky but works for the "Create file" flow.
        window.downloadLastCodeBlock = function (filename) {
            // Find the pre block immediately preceding this button's parent or similar
            // Since we don't have easy DOM traversal from the string, we'll traverse in the click handler.
            // Actually, identifying the right code block is hard from a global function.
            // Better behavior: The user copies the code. The button is just sugar.
            // Let's implement a simple "find closest pre" logic if possible, or just download placeholder.

            // Find all pre elements
            const pres = document.querySelectorAll('.eq-message pre');
            if (pres.length > 0) {
                const code = pres[pres.length - 1].textContent;
                const blob = new Blob([code], { type: 'text/plain' });
                const url = window.URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = filename;
                a.click();
            } else {
                alert("Could not find code to download.");
            }
        };

        function addUserMessage(text) {
            removeWelcomeScreen();
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message user-message';

            // Check if file attached
            if (currentFileName) {
                text += `\n[Attached: ${currentFileName}]`;
            }

            messageDiv.innerText = text; // User input is plain text
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function addEQMessage(text) {
            const messageDiv = document.createElement('div');
            messageDiv.className = 'message eq-message';
            messageDiv.innerHTML = parseMarkdown(text); // Render markdown
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'typing-indicator';
            for (let i = 0; i < 3; i++) {
                const dot = document.createElement('div');
                dot.className = 'typing-dot';
                typingDiv.appendChild(dot);
            }
            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
            return typingDiv;
        }

        async function eqRespond(userMessage) {
            const typingIndicator = showTyping();

            // Prepare payload
            let prompt = userMessage;
            if (currentFileContent) {
                prompt += `\n\n[USER UPLOADED FILE CONTENT (${currentFileName})]:\n${currentFileContent}`;
                // Keep file content attached only for this turn? Yes.
                clearFile();
            }

            try {
                let userId = localStorage.getItem('eq_user_id');
                if (!userId) {
                    userId = 'guest_' + Math.random().toString(36).substr(2, 9);
                    localStorage.setItem('eq_user_id', userId);
                }
                const res = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        message: prompt,
                        user_id: userId
                    })
                });
                const data = await res.json();

                if (typingIndicator.parentNode) chatMessages.removeChild(typingIndicator);
                addEQMessage(data.response);

                // Text-to-Speech (Simple)
                // Only if response is short or user used voice? 
                // Let's not force it unless requested, as it can be annoying.
                // But the user asked for voice chat. 
                // I'll add a check: if the previous input was from voice (we can track this), speak the response.
                // For now, I'll leave TTS manual or implied. "Allow users to use voice chat" usually means Input.
            } catch (error) {
                if (typingIndicator.parentNode) chatMessages.removeChild(typingIndicator);
                addEQMessage("Hey — I'm having trouble connecting to the cloud right now ☁️ Please try again in a moment.");
                console.error('Error:', error);
            }
        }

        function handleSend() {
            const message = userInput.value.trim();
            if (message || currentFileContent) {
                addUserMessage(message || "(File Upload)");
                // Attach file content logic is inside eqRespond via global variable, 
                // but addUserMessage needs to show it. Done.

                userInput.value = '';
                eqRespond(message || "Analyze this file.");
            }
        }

        sendButton.addEventListener('click', handleSend);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') handleSend();
        });

        userInput.focus();
    </script>
</body>

</html>
