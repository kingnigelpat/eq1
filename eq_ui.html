<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EQ - Your Emotional Companion</title>
    <link rel="icon" href="/static/RAE-removebg-preview.png" type="image/png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
        }

        :root {
            --primary: #D4AF37;
            --primary-glow: rgba(212, 175, 55, 0.1);
            --bg-black: #000000;
            --bg-dark: #111111;
            --bg-accent: #1a1a1a;
            --text-white: #ffffff;
            --text-gray: #e0e0e0;
            --text-muted: #666666;
            --header-height: 60px;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: var(--bg-black);
            color: var(--text-white);
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .chat-container {
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-black);
            max-width: 800px;
            border-left: 1px solid rgba(255, 255, 255, 0.05);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
        }

        @media (max-width: 800px) {
            .chat-container {
                max-width: 100%;
                border: none;
            }
        }

        .chat-header {
            flex-shrink: 0;
            height: var(--header-height);
            background-color: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: var(--primary);
            padding: 0 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .logo-text {
            font-weight: 600;
            letter-spacing: 1px;
            font-size: 1.1rem;
        }

        .logout-link {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            font-size: 0.8rem;
            transition: color 0.2s;
        }

        .logout-link:hover {
            color: var(--primary);
        }

        .chat-messages {
            flex: 1;
            padding: 20px 15px;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 16px;
            scrollbar-width: thin;
            scrollbar-color: var(--bg-accent) transparent;
            -webkit-overflow-scrolling: touch;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: var(--bg-accent);
            border-radius: 10px;
        }

        .welcome-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
            animation: fadeIn 0.6s ease-out;
            height: 100%;
        }

        .welcome-title {
            font-size: clamp(1.6rem, 8vw, 2.4rem);
            font-weight: 300;
            background: linear-gradient(135deg, #FFD700, #D4AF37, #AA8C2C);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
        }

        .welcome-subtitle {
            color: var(--text-muted);
            font-size: clamp(0.85rem, 4vw, 1rem);
            max-width: 400px;
            line-height: 1.5;
        }

        .message {
            max-width: 85%;
            padding: 10px 16px;
            border-radius: 18px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: slideUp 0.3s ease-out;
            word-wrap: break-word;
        }

        .user-message {
            background-color: var(--primary);
            color: #000;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            font-weight: 500;
        }

        .eq-message {
            background-color: var(--bg-accent);
            color: var(--text-gray);
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Image Styling in Chat */
        .eq-message img {
            max-width: 100%;
            border-radius: 8px;
            margin-top: 8px;
            display: block;
        }

        .eq-message code {
            font-family: monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 2px 4px;
            border-radius: 4px;
        }

        .message pre {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 8px 0;
        }

        .chat-input-area {
            flex-shrink: 0;
            padding: 15px;
            background-color: var(--bg-black);
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .input-wrapper {
            width: 100%;
            background-color: var(--bg-accent);
            border-radius: 24px;
            padding: 4px 4px 4px 12px;
            display: flex;
            align-items: center;
            border: 1px solid #333;
            transition: all 0.2s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--primary);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .chat-input {
            flex: 1;
            background: transparent;
            border: none;
            color: white;
            outline: none;
            font-size: 0.95rem;
            padding: 10px 8px;
        }

        .action-button {
            width: 38px;
            height: 38px;
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            color: var(--text-muted);
        }

        .action-button:hover {
            color: var(--primary);
            background: rgba(255, 255, 255, 0.05);
        }

        .send-button {
            width: 38px;
            height: 38px;
            background-color: var(--primary);
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin-left: 4px;
            flex-shrink: 0;
        }

        .send-button:hover {
            background-color: #FFD700;
        }

        .send-button svg {
            width: 18px;
            height: 18px;
            fill: #000;
        }

        .action-button svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .recording {
            color: #ff4444 !important;
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(255, 68, 68, 0.4);
            }

            70% {
                box-shadow: 0 0 0 6px rgba(255, 68, 68, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(255, 68, 68, 0);
            }
        }

        .file-indicator {
            display: none;
            padding: 4px 12px;
            background: rgba(212, 175, 55, 0.1);
            border-radius: 12px;
            color: var(--primary);
            font-size: 0.75rem;
            margin-bottom: 8px;
            align-items: center;
            gap: 6px;
        }

        .file-indicator.active {
            display: flex;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 10px 16px;
            background-color: var(--bg-accent);
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            align-self: flex-start;
            margin-bottom: 8px;
            flex-shrink: 0;
        }

        .typing-dot {
            width: 5px;
            height: 5px;
            background-color: var(--primary);
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
            opacity: 0.5;
        }

        .typing-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {

            0%,
            60%,
            100% {
                transform: translateY(0);
            }

            30% {
                transform: translateY(-4px);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .chat-inputs-row {
                gap: 4px;
            }

            .message {
                max-width: 90%;
                font-size: 0.9rem;
            }

            .input-wrapper {
                padding-left: 8px;
            }
        }

        /* Voice Mode Overlay */
        .voice-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 1000;
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            transition: opacity 0.3s ease;
        }

        .voice-overlay.active {
            display: flex;
        }

        .voice-status {
            font-size: 1.5rem;
            margin-bottom: 40px;
            font-weight: 300;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .voice-visualizer {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--primary);
            box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.4);
            animation: pulse-gold 2s infinite;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 60px;
        }

        .voice-visualizer svg {
            width: 40px;
            height: 40px;
            fill: #000;
        }

        .voice-visualizer.speaking {
            animation: pulse-speaking 1s infinite;
            background: #fff;
        }

        .close-voice-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 12px 30px;
            border-radius: 30px;
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }

        .close-voice-btn:hover {
            border-color: #ff4444;
            color: #ff4444;
            background: rgba(255, 68, 68, 0.1);
        }

        @keyframes pulse-gold {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0.7);
            }

            70% {
                transform: scale(1);
                box-shadow: 0 0 0 20px rgba(212, 175, 55, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(212, 175, 55, 0);
            }
        }

        @keyframes pulse-speaking {
            0% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7);
            }

            50% {
                transform: scale(1.1);
                box-shadow: 0 0 0 30px rgba(255, 255, 255, 0);
            }

            100% {
                transform: scale(0.95);
                box-shadow: 0 0 0 0 rgba(255, 255, 255, 0);
            }
        }
    </style>
</head>

<body>
    <div class="chat-container">
        <header class="chat-header">
            <div class="logo-text">EQ</div>
            <div style="display:flex;gap:15px;align-items:center;">
                <button id="voiceCallBtn" class="action-button" title="Start Voice Call" style="color:var(--primary)">
                    <svg viewBox="0 0 24 24">
                        <path
                            d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.28 1.12.27 2.33.41 3.57.41.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.14 2.45.41 3.57.08.35-.01.74-.28 1.02l-2.2 2.2z" />
                    </svg>
                </button>
                <a href="/logout" class="logout-link">Logout</a>
            </div>
        </header>

        <!-- Voice Overlay -->
        <div class="voice-overlay" id="voiceOverlay">
            <div class="voice-status" id="voiceStatus">Initializing...</div>

            <div class="voice-visualizer" id="voiceVisualizer" onclick="activateVoiceOnMobile()"
                style="cursor: pointer;">
                <svg viewBox="0 0 24 24">
                    <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z" />
                </svg>
            </div>

            <!-- Live Transcript -->
            <div id="voiceTranscript"
                style="margin: 0 20px 30px; text-align: center; max-width: 600px; min-height: 24px; color: rgba(255,255,255,0.8); font-size: 1.1rem; line-height: 1.4;">
            </div>

            <!-- Manual Control Buttons -->
            <div style="display: flex; gap: 20px; align-items: center; margin-bottom: 30px;">
                <!-- Mic Toggle / Status -->
                <!-- Send Button -->
                <button id="voiceSendBtn" class="action-button"
                    style="background:var(--primary); width: 64px; height: 64px; color: #000; display:none;"
                    title="I'm Done Speaking">
                    <svg viewBox="0 0 24 24" style="width: 32px; height: 32px;">
                        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                    </svg>
                </button>
            </div>

            <button class="close-voice-btn" onclick="endVoiceCall()">End Call</button>
        </div>

        <main class="chat-messages" id="chatMessages">
            <div class="welcome-container" id="welcomeScreen">
                <div class="welcome-title">How do you feel today?</div>
                <div class="welcome-subtitle">I'm EQ, your emotional companion. Share your thoughts, upload a file, or
                    create something new.</div>
            </div>
        </main>

        <section class="chat-input-area">
            <div id="fileIndicator" class="file-indicator">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
                    <path
                        d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z" />
                </svg>
                <span id="fileName">File attached</span>
                <span style="cursor:pointer" onclick="clearFile()">×</span>
            </div>

            <div class="input-wrapper">
                <input type="file" id="fileInput" hidden>

                <button class="action-button" id="uploadBtn" title="Upload File">
                    <svg viewBox="0 0 24 24">

                            currentFileContent) { addUserMessage(message || "(File Upload)" ); // Attach file content
                            logic is inside eqRespond via global variable, // but addUserMessage needs to show it. Done.
                            userInput.value='' ; eqRespond(message || "Analyze this file." ); } }
                            sendButton.addEventListener('click', ()=> {
                            // If we send via button, we assume standard flow.
                            // But if they were just speaking, isVoiceMode is true.
                            handleSend();

</body>

</html>
