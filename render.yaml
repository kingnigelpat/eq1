services:
  - type: web
    name: eq1-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -b 0.0.0.0:$PORT -k gthread --threads 4 wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: OPENROUTER_API_KEY
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
        description: "Base64-encoded or raw JSON of your Firebase service account key"
      - key: SECRET_KEY
        sync: false
        description: "Flask secret key for session management"
